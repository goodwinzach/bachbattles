<script>"use strict";(()=>{var lm=Object.defineProperty;var $e=(e,t,o)=>()=>{if(o)throw o[0];try{return e&&(t=e(e=0)),t}catch(s){throw o=[s],s}};var dm=(e,t)=>{for(var o in t)lm(e,o,{get:t[o],enumerable:!0})};var Dt,O,Ol,Nl,Rt,Ul=$e(()=>{"use strict";Dt=e=>({hp:e.hpMax,status:"alive",effects:[],mask:e.mask??"",dmNote:"",...e}),O=e=>({status:e.status??"unmet",hp:e.stat?.hp??null,phase:0,dmNote:"",...e}),Ol=[Dt({id:"flynn",name:"Flynn",player:"Flynn",title:"The Groom",tagline:"The masked man. Getting married tomorrow. Has no ring.",icon:"venetian-mask",hue:"yellow",ac:14,hpMax:32,stats:{str:1,agi:2,cha:-1,per:3,int:0},mask:"spider-mask",bio:"The groom. Wakes up in a field in a vomit-stained [[item:spider-mask]] with his [[item:wedding-ring]] gone and only three of his four masks: the [[item:spider-mask]], the [[item:batman-cowl]] and the [[item:inkblot-mask]]. He cannot remember what the [[item:v-mask|fourth mask]] was.",play:"Flynn begins the game assuming the masks make him better. The ending works because the strongest version of Flynn is the one with no mask at all. Do not explain this theme to the players.",abilities:["mask-swap","spider-sense","batman-vision","inkblot-strength","unmasked","plot-armor"],secrets:["The instant Flynn voluntarily removes his mask, his Charisma becomes **+100** ([[ability:unmasked]]). Reveal it only when it happens, even if that is early.","Flynn cannot die before the Lou finale ([[ability:plot-armor]]). Never announce it.","Charisma is \u22121 only while masked. The base stat below is the masked value."],films:["spider-verse","batman","watchmen","v-for-vendetta"]}),Dt({id:"goodwin",name:"Forrest Gumpwin",player:"Goodwin",title:"The Lucky Runner",tagline:"Fast, weirdly lucky, saved again and again by absurd coincidence.",icon:"footprints",hue:"blue",ac:14,hpMax:32,stats:{str:0,agi:3,cha:1,per:2,int:-1},bio:"Sits in a booster seat at the bar. Unlike [[pc:haydn]], he does not look his age. Fast, weirdly lucky, and repeatedly saved by absurd coincidence.",play:"Reward plans built on absurd coincidence. When he runs, he runs with advantage.",abilities:["run-gumpwin-run","gump-luck"],notes:["A [[item:dr-pepper]] is hidden among the food in [[scene:gluttony]]. If he drinks it: +3 Agility for the rest of that scene."],films:["forrest-gump"]}),Dt({id:"alex",name:"Dude Bro",player:"Alex",title:"The Stoner",tagline:"Relaxed, physically reckless, socially shameless.",icon:"cannabis",hue:"green",ac:14,hpMax:32,stats:{str:2,agi:1,cha:3,per:0,int:-1},bio:"Spent last night trying to talk up [[npc:nerissa]], an elven fairy, and could not stop staring at her wings. Frequently operating on a completely different wavelength from the danger around him.",play:"Let his clumsiness become a weapon. Never require real substance use; miming the bong rip is fine.",abilities:["bong-flight","drunken-momentum"]}),Dt({id:"haydn",name:"Master Oogwaydn",player:"Haydn",title:"The 1,000-Year-Old Turtle",tagline:"Kung fu master. Technically the best fighter here. Still a turtle.",icon:"turtle",hue:"violet",ac:14,hpMax:32,stats:{str:-1,agi:3,cha:1,per:2,int:0},bio:"Nearly 1,000 years old, calm and highly trained. Spent last night trying to flag down the bartender for a vodka Red Bull to keep up with the other groomsmen. Not naturally powerful without something to fight with.",play:"Oogwaydn should sound ancient and wise even when asking for a vodka Red Bull or fighting with a mop. Mention staff-like objects in every environment so he can scavenge them.",abilities:["master-of-the-staff","no-accidents"],films:["kung-fu-panda"]}),Dt({id:"jamie",name:"Jam Radish",player:"Jamie",title:"The Radish Spirit",tagline:"A huge, strange spirit creature who belongs in Spirited Away.",icon:"sprout",hue:"magenta",ac:14,hpMax:32,stats:{str:2,agi:-1,cha:1,per:3,int:0},bio:"A big white sumo-wrestler-like figure with two tendrils on his face. Last night he attempted the dance from Deadpool & Wolverine and broke the floor paneling of [[npc:michael-pearson]]'s bar while dancing to NSYNC.",play:"His abilities should feel supernatural and open-ended, and should respond to whatever is already in the scene.",abilities:["spiritual-moment","spirit-weight"],films:["spirited-away","deadpool-wolverine"]})],Nl=[O({id:"sheep",name:"The Sheep",side:"neutral",icon:"rabbit",role:"Wakes [[pc:flynn]] up in the field.",look:"Staring. Judging.",minor:!0}),O({id:"bartender",name:"The Bartender",side:"neutral",icon:"beer",role:"Runs the bar at the Green Dragon Inn. Calls his boss the moment the group walks in.",look:"Can look like anything.",play:"Recognizes them instantly, phones his boss, hangs up, and says only that they should not stay long.",knows:["They were horrible customers.","[[pc:flynn]] talked to a redheaded woman.","[[pc:jamie]] damaged the floor.","He does **not** know where the ring went."],lines:["You shouldn't stay long."]}),O({id:"narrator",name:"The Narrator",aka:"Doesn't remember his name",film:"fight-club",side:"neutral",icon:"user-x",role:"Confused man in the Green Dragon. Red herring, and setup for [[npc:tyler]].",look:"Looks exactly like Edward Norton. A little beat up and tired.",personality:"Exhausted, irritated, uncertain. Gets more irritated with every question.",play:"Slightly hunched, tired, defensive. Has no recollection of who anyone is.",knows:["Nothing useful. Do not give him ring information."],important:["Same body as [[npc:tyler]]. If Odysseus shoots Tyler on the docks, the Narrator comes back and helps disarm the bombs."],lines:["I don't know you. I barely know me right now.","Why does everyone keep asking me about last night?","Why am I on a dock? Why is there an arrow in me?"]}),O({id:"antinous",name:"Antinous",film:"the-odyssey",side:"neutral",icon:"sword",group:"suitors",role:"Arrogant bar patron with a sword. Wants the redhead's number.",look:"Robert Pattinson in The Odyssey. Has a sword.",personality:"Handsome, spoiled, bullying, amused by other people's discomfort.",wants:"The number of the redheaded woman who was hitting on [[pc:flynn]] last night.",play:"Teases Flynn about the woman being out of his league. Do not let a side fight run past 2 rounds unless the table loves it.",knows:["Does not know where the ring went.","Remembers the redheaded woman."],lines:["You don't remember her? That's somehow worse. Give me the number."],stat:{ac:14,hp:20,attacks:[{name:"Sword",bonus:4,dmg:"1d8",range:"Close"}]}}),O({id:"suitor-bow",name:"Suitor with a Bow",film:"the-odyssey",side:"neutral",icon:"crosshair",group:"suitors",role:"One of [[npc:antinous]]'s hangers-on. Laughs at his jokes.",look:"With Robert Pattinson. Can look like anything. Bow and arrows.",play:"Escalates the teasing. Not important enough for long conversations.",lines:["She was out of your league even before the vomit mask."],stat:{ac:12,hp:12,attacks:[{name:"Bow",bonus:3,dmg:"1d8",range:"Far Away"}]}}),O({id:"suitor-shield",name:"Suitor with Shield & Dagger",film:"the-odyssey",side:"neutral",icon:"shield",group:"suitors",role:"[[npc:antinous]]'s other hanger-on.",look:"With Robert Pattinson. Can look like anything. Shield and dagger.",stat:{ac:13,hp:12,attacks:[{name:"Dagger",bonus:3,dmg:"1d6",range:"Close",note:"AC includes the shield (+1)."}]}}),O({id:"nerissa",name:"Nerissa",side:"neutral",icon:"sparkles",role:"The elven fairy who turned down [[pc:alex]] last night.",look:"Elven fairy. Wings he could not stop staring at.",personality:"Visibly disgusted by Dude Bro.",play:"Every interaction with Alex should make her want to leave faster.",knows:["Nothing about the ring."],important:["If Alex somehow rolls a natural 20 on Charisma, she gives him one useful fact just to make him leave: Flynn was with the redhead."],lines:["No.","Still no."]}),O({id:"michael-pearson",name:"Michael Pearson",film:"the-gentlemen",side:"boss",icon:"crown",group:"gentlemen",role:"Owner of the Green Dragon. Wants 500 gold for damages.",personality:"Controlled crime boss. Polite because he does not need to shout.",play:"Calm, still, articulate. Lets Ray and Coach move while he talks. Points out that [[pc:jamie]] broke the floor paneling dancing to NSYNC.",wants:"Get paid, or restore respect.",lines:["You owe me five hundred. I am giving you the rare opportunity to decide whether the payment is financial.","That answer cost you the remaining fifty. Try again."],stat:{ac:13,hp:18,attacks:[{name:"Pistol",bonus:3,dmg:"1d8",range:"Far Away"},{name:"Close strike",bonus:2,dmg:"1d6",range:"Close"}],behavior:"Talks first, fights only if necessary."}}),O({id:"ray",name:"Ray",film:"the-gentlemen",side:"foe",icon:"glasses",group:"gentlemen",role:"Michael's precise fixer.",personality:"Professional, practical, dry, observant.",play:"Speaks less than Michael. Watches hands and exits.",stat:{ac:14,hp:20,attacks:[{name:"Pistol",bonus:4,dmg:"1d8",range:"Far Away"},{name:"Improvised strike",bonus:3,dmg:"1d6",range:"Close"}],behavior:"Targets whoever seems most competent."}}),O({id:"coach",name:"Coach",film:"the-gentlemen",side:"foe",icon:"hand-fist",group:"gentlemen",role:"Michael's physical backup.",personality:"Blunt, surprisingly reasonable until violence starts.",play:"More expressive than Ray. Treats the fight like annoying work.",stat:{ac:14,hp:22,attacks:[{name:"Pistol",bonus:3,dmg:"1d8",range:"Far Away"},{name:"Punch / grapple",bonus:4,dmg:"1d6",range:"Close"}],behavior:"Closes distance and brawls."}}),O({id:"louise",name:"Louise Banks",film:"arrival",side:"ally",icon:"phone-call",role:"Flynn's flirtatious contact and the path to [[npc:costello]].",look:"The redhead. Saved in Flynn's phone with a picture of Amy Adams.",personality:"Intelligent, curious, warm, composed. Openly flirtatious with Flynn.",play:"Calm voice, amused by Flynn's masks, slightly disappointed when he only wants the ring.",important:["She never answers texts. Only a phone call.","No roll is required to get her address. It is a required story transition."],lines:["You finally called. I was starting to think the masks were doing all the confidence for you.","I was hoping you called because you remembered me.","You were very confident last night for a man who never showed his face.","I have something else that could go on your face.","I know someone who experiences answers differently. Come alone if you want. Bring your friends if you have to."]}),O({id:"abbott",name:"Abbott",film:"arrival",side:"oracle",icon:"orbit",role:"Heptapod. Floats beside Costello in the bean-shaped craft.",personality:"Alien, unreadable, not hostile.",play:"Silent presence. Costello does the answering."}),O({id:"costello",name:"Costello",film:"arrival",side:"oracle",icon:"orbit",role:"Heptapod oracle. Answers exactly three of Flynn's questions.",personality:"Alien, unreadable, not hostile. Time does not feel linear to them.",play:"Answers are true but sound like memories of things that have not happened yet. Keep answers short. Never explain the riddle.",important:["If Flynn asks what the riddle means, Costello does not explain. The question still counts.","If the first two questions do not reveal the riddle, the third answer must end with: 'Out of the closet without a face.'"],lines:["The man who records what should not be recorded already wears what was yours.","You meet the ring again beneath false sunlight in Hollywood.","You are dead there. Most of you are speaking anyway.","Out of the closet without a face."]}),O({id:"tyler",name:"Tyler Durden",aka:"Edward Norton, again",film:"fight-club",side:"boss",icon:"bomb",role:"Lou's blocker at the airfield or the docks. Same body as [[npc:narrator]], completely different energy.",personality:"Cocky, amused, provocative. Enjoys making people prove themselves.",play:"Upright, confident, smiling during danger. He wants Flynn to fight because the fight itself proves a point.",wants:"To pay back a favor: he lost a fight to [[npc:lou]] and owes him one. The favor is stopping the party.",important:["Tyler sabotages travel even if Flynn wins. On the plane route he blows up the planes anyway."],lines:["You keep thinking winning means I have to keep my word.","Lou beat me. I owe him one. You're the one.","You won the fight. You didn't win an airplane."],stat:{ac:15,hp:28,attacks:[{name:"Fist",bonus:5,dmg:"1d8",range:"Close"}],specials:[{name:"Dirty counter",uses:"1/fight",text:"After Flynn misses a Close attack, Tyler immediately deals {{1d4}} damage."}],behavior:"One-on-one fist fight with Flynn. No weapons unless Flynn cheats."}}),...[["goon-crowbar","Crowbar Goon","Crowbar","1d8","wrench"],["goon-sledgehammer","Sledgehammer Goon","Sledgehammer","1d10","hammer"],["goon-machete","Machete Goon","Machete","1d8","slice"],["goon-chainsaw","Chainsaw Goon","Chainsaw","1d10","cog"],["goon-taser","Taser Goon","Taser","1d6","zap"]].map(([e,t,o,s,n])=>O({id:e,name:t,side:"foe",icon:n,group:"goons",film:"fight-club",role:"One of five goons who step out of the airplane hangar for [[npc:tyler]].",look:"Can look like anything.",play:"Goons should fall quickly. They exist so everyone gets to use combat toys.",minor:!0,stat:{ac:12,hp:10,attacks:[{name:o,bonus:3,dmg:s,range:"Close",note:o==="Taser"?"On a hit, the target also loses movement next turn unless they beat {{str:10}}.":void 0}]}})),O({id:"odysseus",name:"Odysseus",film:"the-odyssey",side:"ally",icon:"sailboat",role:"Captain sailing to California for the premiere of Anne Hathaway's new movie. Welcomes the group aboard.",personality:"Experienced, confident, practical. Accepts absurd events because his life has already been mythological nonsense.",play:"Dry acceptance. He is not impressed by the groomsmen.",important:["Boat route: if Flynn is clearly losing to Tyler, Odysseus shoots Tyler in the head with an arrow."],lines:["California is west. Eventually.","I've been lost longer than you've been married, which apparently is not at all. Get on the boat."]}),O({id:"odysseus-crew",name:"Odysseus's Men",film:"the-odyssey",side:"ally",icon:"users",role:"Five sailors who follow Odysseus ashore. Treat them as one allied group.",play:"Do not run five individual initiatives unless necessary. They roll as one group against Medusa.",important:["Some or all may be turned to stone or die on the island. The outline does not require their deaths."],stat:{ac:13,hp:12,attacks:[{name:"Sword",bonus:3,dmg:"1d8",range:"Close"},{name:"Bow",bonus:3,dmg:"1d8",range:"Far Away"}],behavior:"HP is per man. Five men."}}),O({id:"john-doe",name:"John Doe",film:"se7en",side:"boss",icon:"package",role:"Guardian of Medusa's head and the seven sin buildings.",look:"Bald. Calmly packaging a small box in the middle of the clearing.",personality:"Calm, patient, morally theatrical. Enjoys making people participate in the horror.",play:"Never rush. He acts like the group is proving something about themselves. Say 'What's in the box?' casually, never shouted.",knows:["[[npc:lou]] also stopped by. In return for protection, he gave John head."],lines:["What's in the box?","There is plenty of food on this island. First, a question."],stat:{ac:12,hp:16,attacks:[{name:"Knife",bonus:3,dmg:"1d6",range:"Close"}],specials:[{name:"Medusa's Head",text:"A hazard, not a normal attack. See [[item:medusa-head]]."}],behavior:"Deliberately easy. Medusa is the encounter. Only Flynn can safely approach."}}),O({id:"david-frame",name:"David Frame",side:"boss",icon:"utensils-crossed",role:"PRIDE. A personal, Flynn-specific reunion with over thirty knives.",look:"Sharpening a knife beside a table of more than thirty knives.",personality:"Calm, creepy, overly familiar, knife-obsessed.",play:"Much more unsettling if he acts like this reunion is normal. Focuses Flynn first but attacks anybody who interferes.",lines:["Flynn, is that you? Still wearing masks huh? It's been awhile man, how come you haven't reached out? I've been wanting to show you some new tricks I've learned."],stat:{ac:14,hp:24,attacks:[{name:"Knife",bonus:4,dmg:"1d6",range:"Close"}],specials:[{name:"Knife flurry",uses:"1/fight",text:"Attack twice; each hit deals {{1d4}}."}]}}),...[1,2,3].map(e=>O({id:`gladiator-${e}`,name:`Lust Gladiator ${e}`,film:"gladiator",side:"foe",icon:"heart",group:"gladiators",minor:!0,role:"LUST. One of a group of naked gladiators who enthusiastically want to seduce the party.",play:"Do not over-describe this. The joke is the premise. The room should be brief.",stat:{ac:12,hp:12,attacks:[{name:"Grapple / punch",bonus:3,dmg:"1d4",range:"Close"}]}})),O({id:"ted-terger",name:"Ted Terger",film:"stitched",side:"boss",icon:"banknote",role:"GREED. Guards stacks of counterfeit money and cases of alcohol.",personality:"Grounded and territorial. Treats the stash like a business operation.",play:"Keep the performance grounded compared with the more cartoonish rooms. Throws beer bottles; uses stacks and cases as obstacles.",stat:{ac:13,hp:22,attacks:[{name:"Beer bottle throw",bonus:3,dmg:"1d6",range:"Nearby / Far Away"},{name:"Broken bottle",bonus:3,dmg:"1d6",range:"Close"}],specials:[{name:"Cash storm",uses:"1/fight",text:"Everyone Close makes {{per:10}}. On a failure, the distraction gives Ted advantage on his next attack."}]}}),O({id:"truman",name:"Truman Burbank",film:"truman-show",side:"neutral",icon:"door-open",role:"ENVY. Stuck in this building ever since he escaped his own world.",personality:"Earnest, desperate, excited by the idea of seeing the real world.",play:"He asks where they are going and becomes obsessed with leaving. He does not attack first.",important:["If they leave him alive and unattended, Truman later steals a boat. No strategic punishment. It is just funny."],lines:["Hollywood is real, right? Like actually real?"],stat:{ac:11,hp:18,attacks:[{name:"Improvised object",bonus:1,dmg:"1d4",range:"Close",note:"Only if the players attack him first."}]}}),O({id:"kingpin",name:"Kingpin",film:"spider-verse",side:"boss",icon:"biceps-flexed",role:"WRATH. Huge, brutal, impatient.",personality:"Huge, brutal, impatient.",play:"Only attacks if Flynn is wearing the [[item:spider-mask]]. If Flynn enters as Batman or Inkblot, Kingpin stares, grunts, and does not care. If Flynn switches into Spider-Man inside, he is immediately furious.",important:["Clever solution: Flynn removes or switches the Spider-Man mask and Kingpin's aggression collapses. Do not explain this unless players notice."],lines:["Spider-Man."],stat:{ac:15,hp:38,attacks:[{name:"Fist",bonus:5,dmg:"1d10",range:"Close"}],specials:[{name:"Slam",uses:"1/fight",text:"Everyone Close rolls {{agi:12}}. Failure takes {{1d8}} and is knocked to Nearby."}]}}),O({id:"cypher",name:"Cypher",film:"the-matrix",side:"boss",icon:"zap",role:"SLOTH. Lounging with a lightning rifle.",personality:"Cynical, tired, wants comfort instead of truth or effort.",play:"Complains that he does not want to take any pills, then immediately fires.",lines:["I don't want to take any pills."],stat:{ac:13,hp:24,attacks:[{name:"Lightning rifle",bonus:4,dmg:"1d10",range:"Far Away"},{name:"Close shove",bonus:2,dmg:"1d4",range:"Close"}]}}),O({id:"baron",name:"Baron Harkonnen",film:"dune-2",side:"boss",icon:"droplet",group:"harkonnens",role:"GLUTTONY. Island climax. Sits in an oil bath in a room absurdly full of food.",look:"Pale, bald, enormous, in an oil bath.",personality:"Grotesque, indulgent, cold.",play:"Stays back and commands or splashes oil. Mostly stationary.",stat:{ac:13,hp:28,attacks:[{name:"Oil splash",bonus:3,dmg:"1d6",range:"Nearby"}],specials:[{name:"Command",text:"Instead of attacking, give [[npc:feyd]] or [[npc:rabban]] advantage on their next attack."}]}}),O({id:"feyd",name:"Feyd-Rautha",film:"dune-2",side:"foe",icon:"sword",group:"harkonnens",role:"Fast knife fighter guarding the Baron.",personality:"Enjoys violence. Smiles when hurt.",play:"Attacks the fastest or most skilled-looking player.",stat:{ac:15,hp:26,attacks:[{name:"Dagger",bonus:5,dmg:"1d6",range:"Close"}],specials:[{name:"Blood rush",text:"When below 13 HP, his dagger damage becomes {{1d8}}."}]}}),O({id:"rabban",name:"Beast Rabban",film:"dune-2",side:"foe",icon:"axe",group:"harkonnens",role:"Brute enforcer guarding the Baron.",personality:"Angry, direct, violent.",play:"Attacks whoever is closest. Slower, heavier hits.",stat:{ac:14,hp:30,attacks:[{name:"Heavy strike",bonus:4,dmg:"1d10",range:"Close"},{name:"Shove",bonus:4,range:"Close",note:"Instead of damage, push the target from Close to Nearby."}]}}),O({id:"nathan-fielder",name:"Nathan Fielder",film:"the-rehearsal",side:"neutral",icon:"monitor-play",role:"Awkward host who helped film the group. Now terrified of Lou.",look:"Wears his laptop harness, but the screen faces away from him.",personality:"Flat, awkward, painfully literal. Long pauses are useful.",play:"He explains insane things like business logistics.",lines:["So there was a misunderstanding where I thought we were making a documentary and Lou thought we were making evidence.","I am technically also being held hostage, although I did sign a release.","I thought there would be more consent paperwork before the deaths."]}),O({id:"camera-crew",name:"The Camera Crew",side:"foe",icon:"video",role:"Nathan's crew. Their camcorders are decoys that fire sedative needles.",play:"Everyone eventually goes down. A good roll only changes how.",minor:!0}),O({id:"lou",name:"Lou Bloom",film:"nightcrawler",side:"boss",icon:"camera",role:"Main villain. Ring thief. Documentary mastermind.",personality:"Calm, intense, transactional, emotionally wrong. Treats tragedy like a business opportunity. Rarely raises his voice until the studio reveal.",wants:"Great footage, control, and the ring, until Flynn forces the emotional and physical opening needed to take it back.",play:'Direct eye contact. Overly formal sentences. Talks about death as "content," "value," "opportunity," or "the story."',important:["Do not make him a cackling villain. He genuinely thinks his plan is smart.","His confidence should be at its highest right before Flynn removes his own mask.","Weakness: he wants control, attention, and the perfect image."],lines:["I didn't steal the night from you. I preserved it.","Five friends crossing the world for a wedding ring is already a story. Five friends dying for it is a market.","Continuity matters. That's why I let you keep the weapons.","You kept giving me better material than I could have directed.","Two hours. I had to shoot inserts while you were unconscious.","I want you to meet an old boyfriend of mine.","You'll never guess where I got this from."],stat:{ac:15,hp:24,attacks:[{name:"Pistol or studio weapon",bonus:4,dmg:"1d8",range:"Far Away"}],behavior:"Masked phase. Keeps distance whenever possible. The scene should not resolve through damage while he wears the [[item:v-mask]]. He refuses to come Close."},phases:[{label:"Masked",stat:{ac:15,hp:24,attacks:[{name:"Pistol or studio weapon",bonus:4,dmg:"1d8",range:"Far Away"}],behavior:"Keeps distance. The solution is social: Flynn removes his own mask."}},{label:"Unmasked",stat:{ac:12,hp:14,attacks:[{name:"Unarmed",bonus:2,dmg:"1d4",range:"Close"}],behavior:"Physically vulnerable and Close enough to grapple. Flynn wins. Do not let Lou escape with the ring."}}]}),O({id:"oh-dae-su",name:"Oh Dae-su",film:"oldboy",side:"boss",icon:"hammer",role:"Lou's 'old boyfriend.' First studio combatant.",look:"Walks into the ring of cameras holding a hammer and smiling.",personality:"Feral determination. Little talking. Keeps advancing.",play:"Does not negotiate. Advances relentlessly toward whoever hurt him last. Can be killed or knocked unconscious.",stat:{ac:14,hp:34,attacks:[{name:"Hammer",bonus:5,dmg:"1d10",range:"Close"}],specials:[{name:"Relentless",uses:"1/fight",text:"When reduced below 10 HP, he immediately moves Close to the nearest living player."}]}}),O({id:"toothless",name:"Toothless",film:"httyd",side:"boss",icon:"flame",role:"Second studio combatant. Scarier than Oh Dae-su.",personality:"Fast, animal intelligence, terrifying when weaponized.",play:"Stays Nearby or Far Away when possible, plasma-blasts exposed targets, dives Close to bite, then flies away. Moves two range bands per turn.",important:["At 0 HP Toothless crashes and is incapacitated. You do not need to describe him as dead."],stat:{ac:15,hp:42,attacks:[{name:"Bite / tail",bonus:4,dmg:"1d8",range:"Close"},{name:"Plasma blast",bonus:4,dmg:"1d10",range:"Nearby / Far Away"}],specials:[{name:"Wing burst",uses:"1/fight",text:"Everyone Close rolls {{agi:12}} or gets pushed to Nearby."}]}}),O({id:"cat",name:"The Cat in the Hat",film:"cat-in-the-hat",side:"boss",icon:"cat",role:"Final wipe boss in the expanded build, played personally by the DM.",personality:"Cheerful, playful, reality-breaking, completely unconcerned by physics or violence.",play:"Treat the slaughter like a children's game, not rage. Every attack against him gets a cartoon reaction, never damage.",important:["Invincible. Do not roll HP. Reward high rolls by making the attack spectacular, never by hurting him.","Cannot kill Flynn. A lethal hit leaves Flynn at 1 HP; do not explain why.","Ghosts can distract him (he can see them). A good ghost trick gives a living player advantage, never makes the Cat vulnerable."],lines:["Well. This set is a mess.","Much better. One groom. Cleaner composition."],stat:{ac:null,hp:null,invincible:!0,attacks:[{name:"Giant striped boxing glove",note:"Whatever damage finishes the wipe without dragging."},{name:"Impossible umbrella hook"},{name:"Door in midair",note:"Opens a door and drops someone through it."},{name:"Stretching arm",note:"Reaches across the room."},{name:"Thing 1 & Thing 2",note:"Coordinated hit."},{name:"Floor slide",note:"Turns the floor into a slide into a wall."}],specials:[{name:"Cartoon physics",text:"Bullets make a neat hole in the hat that zips shut. Swords bend into candy canes. Heavy hits flatten him like paper and he pops back up. Explosions leave him holding a tiny umbrella."},{name:"Wipe pacing",text:"Round 1: show invincibility, remove one living non-Flynn player. Round 2: one or two more. Round 3: anyone left except Flynn. Round 4 only for comedy."}],behavior:"When every other player is a ghost, he bows, tidies his hat, and leaves."}}),O({id:"caley",name:"Caley",side:"ally",icon:"heart-handshake",role:"Flynn's bride. The reason for the 36-hour clock.",minor:!0})],Rt=[{a:"pc:flynn",b:"npc:caley",label:"is marrying"},{a:"pc:flynn",b:"npc:louise",label:"got her number last night"},{a:"npc:lou",b:"pc:flynn",label:"stole his ring and fourth mask"},{a:"npc:david-frame",b:"pc:flynn",label:"old acquaintance with knives"},{a:"npc:nerissa",b:"pc:alex",label:"turned him down"},{a:"npc:michael-pearson",b:"pc:jamie",label:"wants paying for the floor he broke"},{a:"npc:antinous",b:"pc:flynn",label:"bullies him for the redhead's number"},{a:"npc:kingpin",b:"item:spider-mask",label:"hates it on sight"},{a:"npc:narrator",b:"npc:tyler",label:"the same body"},{a:"npc:tyler",b:"npc:lou",label:"lost a fight to him; owes a favor"},{a:"npc:louise",b:"npc:costello",label:"friends"},{a:"npc:abbott",b:"npc:costello",label:"heptapod pair"},{a:"npc:bartender",b:"npc:michael-pearson",label:"calls his boss"},{a:"npc:ray",b:"npc:michael-pearson",label:"fixer"},{a:"npc:coach",b:"npc:michael-pearson",label:"muscle"},{a:"npc:suitor-bow",b:"npc:antinous",label:"hanger-on"},{a:"npc:suitor-shield",b:"npc:antinous",label:"hanger-on"},{a:"npc:odysseus-crew",b:"npc:odysseus",label:"his crew"},{a:"npc:odysseus",b:"npc:tyler",label:"shoots him if Flynn is losing"},{a:"npc:goon-crowbar",b:"npc:tyler",label:"goon"},{a:"npc:goon-sledgehammer",b:"npc:tyler",label:"goon"},{a:"npc:goon-machete",b:"npc:tyler",label:"goon"},{a:"npc:goon-chainsaw",b:"npc:tyler",label:"goon"},{a:"npc:goon-taser",b:"npc:tyler",label:"goon"},{a:"npc:john-doe",b:"npc:lou",label:"gave him protection, for a price"},{a:"npc:nathan-fielder",b:"npc:lou",label:"tricked into it; now a hostage"},{a:"npc:camera-crew",b:"npc:nathan-fielder",label:"his crew"},{a:"npc:oh-dae-su",b:"npc:lou",label:'"an old boyfriend"'},{a:"npc:toothless",b:"npc:lou",label:"unleashed by"},{a:"npc:feyd",b:"npc:baron",label:"nephew and blade"},{a:"npc:rabban",b:"npc:baron",label:"nephew and brute"},{a:"npc:gladiator-2",b:"npc:gladiator-1",label:"together"},{a:"npc:gladiator-3",b:"npc:gladiator-1",label:"together"}]});var K,ci,$l,Gl,ui=$e(()=>{"use strict";K=e=>({dmNote:"",...e}),ci=[{id:"core",title:"Core Rules",blurb:"What gets rolled and how hard it is."},{id:"combat",title:"Combat",blurb:"Initiative, turns, range bands, weapons."},{id:"conditions",title:"Conditions, Healing & the Clock",blurb:"Hangover, hunger, the feast, 36 hours."},{id:"death",title:"Death & Donuts",blurb:"Ghosts keep playing. Donuts bring them back."},{id:"secrets",title:"DM Secrets",blurb:"Never read these out loud."},{id:"craft",title:"Running the Night",blurb:"Improvising, pacing, and keeping the spine intact."}],$l=[K({id:"golden-rules",group:"core",title:"The Three DM Rules",summary:"Keep it moving. Failure creates trouble, not dead ends. Protect the story beats, not the route.",list:["**Keep it moving.** If a scene has stopped being funny, dangerous, revealing or useful, push forward.","**Failure should usually create trouble, not a dead end.** If the players need a clue to continue, give it to them even on a bad roll, but attach a consequence.","**Protect the required story beats, not the exact route.** The party must get the ring, reach Hollywood by boat, survive the island, be wiped except Flynn, and reach Flynn vs. Lou. How they get there can be chaotic."],body:["This is not normal D&D. It uses familiar mechanics (dice, combat, stats, weapons, initiative, crits, stupid plans) without classes, spell slots, proficiencies or reactions.","The campaign should feel like a movie the players are allowed to wreck. The DM's job is not to stop stupid ideas; it is to decide what roll the idea needs, what it costs, and how the story reacts."]}),K({id:"the-roll",group:"core",title:"What Players Roll",summary:"Almost every uncertain action is **d20 + stat modifier vs. a Difficulty Class (DC)**.",body:["Players roll dice throughout the game.","Do not make players roll for obvious actions. If there is no interesting failure, just let it happen."],table:{head:["Stat","Used for"],rows:[["**Strength**","Punching, wrestling, lifting, breaking, forcing doors, throwing heavy objects"],["**Agility**","Running, dodging, jumping, balancing, sneaking, physical stunts"],["**Charisma**","Persuasion, lying, flirting, intimidation, distracting, performance"],["**Perception**","Noticing danger, clues, people, traps, hidden details"],["**Intelligence**","Reasoning, remembering, investigating, understanding systems or plans"]]}}),K({id:"dc-ladder",group:"core",title:"Difficulty Classes",summary:"Pick 8, 10, 12, 15, 18 or 20.",table:{head:["DC","Difficulty","Meaning"],rows:[["8","Easy","Most people could do it under pressure"],["10","Standard","Requires a little competence"],["12","Tricky","A real chance of failure"],["15","Hard","Needs skill, luck, or a good plan"],["18","Very hard","Impressive if they pull it off"],["20+","Ridiculous","Possible because this campaign is stupid enough to allow it"]]}}),K({id:"advantage",group:"core",title:"Advantage & Disadvantage",summary:"Roll 2d20. Advantage keeps the higher, disadvantage the lower. They never stack.",list:["**Advantage:** roll {{2d20}} and take the higher result.","**Disadvantage:** roll {{2d20}} and take the lower result.","Do not stack multiple advantages. Two sources of advantage are still just advantage."]}),K({id:"crits",group:"core",title:"Critical Rolls",summary:"Natural 20: success plus one extra benefit. Natural 1: failure plus a complication.",list:["**Natural 20:** the action succeeds and gains one extra benefit.","**Natural 1:** the action fails and creates a funny or harmful complication.","A natural 1 should not automatically kill somebody.","A natural 20 should not let somebody skip Hollywood, defeat the Cat, or erase a required story beat."]}),K({id:"consequence",group:"core",title:"Success with a Consequence",summary:"When a failed roll would stall the campaign, give them what they need and attach a cost.",list:["They find the clue, but the bartender also calls Michael Pearson.","They break the lock, but the noise alerts the goons.","They make the jump, but drop a weapon.","They convince the NPC, but owe them something.","They dodge the first needle, but the camera crew fires again and knocks them out anyway."],body:["Use normal failure when failure itself is funny, dangerous, or creates a new playable situation."]}),K({id:"initiative",group:"combat",title:"Initiative",summary:"Every player rolls **d20 + Agility**. The DM rolls once per enemy or enemy group. Keep the order all fight."}),K({id:"a-turn",group:"combat",title:"A Turn",summary:"One movement and one action. No bonus actions or reactions unless an ability says so.",list:["Attack","Use a special ability","Interact with something important","Help another player","Attempt a stunt","Use an item","Persuade or intimidate, if it makes sense mid-fight"]}),K({id:"range",group:"combat",title:"Range Bands",summary:"Do not measure feet. One movement changes one band.",table:{head:["Range","Meaning"],rows:[["**Close**","Within grabbing, punching, stabbing distance"],["**Nearby**","Across the room, a short sprint away"],["**Far Away**","Across a large space, a rooftop, a long room, the opposite side of the battlefield"]]}}),K({id:"attacking",group:"combat",title:"Attacking",summary:"Roll **d20 + attack modifier vs. the target's AC**. Meet or beat it and roll damage.",list:["Heavy melee: Strength.","Quick melee or a precise weapon: Agility.","Improvised throw: Strength or Agility, depending on how it is used."],body:["All players are intentionally close in durability: **AC 14, HP 32**. Differences come from abilities."]}),K({id:"weapons",group:"combat",title:"Weapon Categories",summary:"Four damage tiers. Guns trade damage for range; shields add +1 AC.",table:{head:["Weapon","Damage","Examples"],rows:[["Unarmed / tiny improvised","{{1d4}}","Punch, slap, mug, rock"],["Light weapon","{{1d6}}","Dagger, small knife, taser, bottle"],["Normal weapon","{{1d8}}","Sword, crowbar, machete, staff, bow, pistol"],["Heavy weapon","{{1d10}}","Sledgehammer, chainsaw, heavy hammer, lightning rifle"]]},list:["**Guns:** pistols deal {{1d8}} and can attack from Far Away. Their advantage is range, not damage. Each of the Gentlemen's pistols has **6 shots**.","**Shields:** a held shield gives **+1 AC** until dropped.","**Help:** spend your action helping someone Close or Nearby; they get advantage on their next relevant roll."]}),K({id:"zero-hp",group:"combat",title:"Zero HP",summary:"There are no death saves. At 0 HP a character immediately dies and becomes a ghost.",body:["See [[rule:ghosts]]. [[pc:flynn]] is the exception until the finale: [[ability:plot-armor]]."]}),K({id:"hangover-hunger",group:"conditions",title:"Hangover & Hunger",summary:"[[cond:hangover]]: \u22122 CHA and \u22122 PER from the start. [[cond:hunger]]: \u22122 AGI at sea. Both end at the feast.",body:["Do not pile on additional small hangover rules. The joke works because the penalty is obvious and annoying.","Hunger stacks with the hangover until the party eats in [[scene:gluttony]]."]}),K({id:"healing",group:"conditions",title:"Major Healing",summary:"The feast in Gluttony is the one full recovery. Damage should matter.",list:["Every living player returns to full HP.","Hangover and Hunger end.","The party obtains five [[item:donuts]].","Other healing should be rare and small, only when an improvised story moment strongly justifies it."]}),K({id:"wedding-clock",group:"conditions",title:"The Wedding Clock",summary:"The wedding is in **36 hours**. Keep it visible. It is pacing pressure, not a physics simulator.",body:["Remove chunks when the party travels, wastes a lot of time, takes a major detour, gets knocked out, or spends hours at sea.","Do not punish players minute by minute."],table:{head:["Moment","Hours left"],rows:[["Wake-up","36"],["After Green Dragon / Louise","31 to 33"],["After the route fight and departure","26 to 29"],["Island arrival","18 to 22"],["Hollywood arrival","8 to 12"],["Studio ending","Very late night, early morning before the wedding"]]}}),K({id:"ghosts",group:"death",title:"The Stitched Rule: Ghosts",summary:"At 0 HP a player dies but stays in the game as a ghost who looks completely real.",list:["Looks completely real unless someone already knows they died.","Can speak and move normally, and can be seen by players and enemies.","Can be attacked by enemies, but cannot be physically injured.","Cannot physically attack or move normal objects.","Can distract, lie to, taunt, scare, confuse, scout or misdirect.","Can make Charisma, Perception and Intelligence rolls. No meaningful Strength or weapon attacks."],body:["Enemies may not realize a character is dead. A ghost can bait attacks, stand in the wrong place, scream fake warnings, or pretend to be an active threat. Reward this.","If a ghost tries something clever, roll normally with CHA, PER or INT. High: the enemy believes the ghost is still physically relevant and wastes attention or an action. Low: the enemy realizes something is wrong, or simply ignores them."],films:["stitched"]}),K({id:"donut-rule",group:"death",title:"The Donut Rule",summary:"A donut plus a statistically improbable real-life action brings a ghost back at full HP.",list:["A living player has a donut.","That player performs a **statistically improbable action in real life**: genuinely stupid, unlikely, absurd or socially ridiculous. It must be done in person.","The DM decides whether it qualifies.","If it does, the donut works and the ghost returns physically at full HP."],body:["The donut alone does nothing.","No dice roll is required for the real-world action. The point is committing to the bit.","Examples should come from the room and the people playing, not a prewritten checklist."],films:["eeaao"]}),K({id:"secret-unmasked",group:"secrets",secret:!0,title:"Unmasked Flynn",summary:"The instant Flynn voluntarily removes his mask, his Charisma becomes **+100**.",body:["See [[ability:unmasked]]. Do not explain it early, and do not prevent him from discovering it early."]}),K({id:"secret-plot-armor",group:"secrets",secret:!0,title:"Plot Armor",summary:"Flynn is required for the ending. He survives at 1 HP until the Lou finale.",body:["See [[ability:plot-armor]]. Never announce it."]}),K({id:"secret-v-mask",group:"secrets",secret:!0,title:"The Fourth Mask",summary:"The missing mask is the [[item:v-mask]]. Lou has it and wears it in the finale.",body:["Do not reveal it until Lou enters."]}),K({id:"secret-wipe",group:"secrets",secret:!0,title:"The Wipe",summary:"Everyone except Flynn must be dead before Lou enters.",body:["Outline version: Oh Dae-su kills at least two players and Toothless takes out everyone except Flynn.","Expanded build: Oh Dae-su and Toothless are attrition, and [[npc:cat]] is the wipe. He is not a fair boss; he is the wipe mechanism and the DM's big character moment.","Switch between the two with the studio gauntlet toggle in Settings."]}),K({id:"improv",group:"craft",title:"When Players Do Something Unplanned",summary:"Possible? Which stat? Pick a DC. Roll. Decide whether failure is fun.",list:["Is it physically or socially possible in this stupid universe?","Which of the five stats fits best?","Pick DC 8, 10, 12, 15, 18 or 20.","Let them roll.","On failure, decide whether failure is fun or whether success-with-consequence keeps things moving."]}),K({id:"skipping",group:"craft",title:"When Players Try to Skip a Required Route",summary:'Never just say "you cannot." Give the attempt a funny outcome that returns them to the spine.',table:{head:["Attempt","What happens"],rows:[["Alex tries to fly to Hollywood","One magnificent airborne turn, then the effect ends over the harbor and he drops back onto the boat or dock."],["Goodwin uses Gump Luck to find Hollywood directly","He accidentally finds a sign, map or person that points toward Odysseus instead."],["They steal a random boat without Odysseus","They sail for hours and return to the same coastline, or realize they are lost. Odysseus is still the useful option."],["They kill a clue NPC","Put the clue on their phone, in the environment, or in another NPC's mouth."]]}}),K({id:"brilliant-plans",group:"craft",title:"When They Make a Brilliant Plan",summary:"Let it matter, but do not let it erase the campaign.",list:["Avoid damage","Give advantage","Shorten a fight","Steal a weapon","Turn an enemy against another enemy","Reveal a clue early"]}),K({id:"pacing",group:"craft",title:"Pacing a 4 to 6 Hour Night",summary:"Cut background conversations and extra sin rooms first. Never cut the spine.",table:{head:["If running long, cut","Never cut","If running short, add"],rows:[["Background bar conversations","Costello's riddle","One more sin room"],["Extra sin rooms","John Doe / Medusa","More roleplay with Antinous or Nerissa"],["Goon HP","Pride first","A longer Tyler confrontation"],["Oh Dae-su HP","Gluttony / donuts","Truman trying to follow the party"],["Toothless HP","The wipe, Flynn unmasking, the Lou finale","More studio environmental stunts"]]},body:["Do not invent a whole side quest."]}),K({id:"reminders",group:"craft",title:"Final DM Reminders",summary:"The short list to re-read right before the game.",list:["Do not explain Flynn's +100 Charisma early.","Do not let Bong Flight skip the boat.","Goodwin's luck should feel like absurd coincidence, not generic magic.","Mention staff-like objects so Oogwaydn can scavenge them.","Jamie's Spiritual Moment should respond to the current scene, not summon a random fantasy inventory.","The island is where death becomes acceptable. Dead players stay engaged as visible ghosts.","Gluttony is the major heal and donut checkpoint.","Toothless and Oh Dae-su soften the party (expanded build); the Cat is the wipe.","Flynn must get the final victory over Lou.","If players are confused in the Lou scene, use Louise's text. Do not immediately explain the answer.","If a required clue is missed, move the clue. Never let the campaign die because somebody rolled badly.","If something is funnier than the written suggestion and does not destroy the story, use the funnier thing."]})],Gl=[{id:"nightcrawler",title:"Nightcrawler",favorite:!0},{id:"truman-show",title:"The Truman Show",favorite:!0},{id:"the-odyssey",title:"The Odyssey",favorite:!0},{id:"fight-club",title:"Fight Club",favorite:!0},{id:"stitched",title:"Stitched",favorite:!0},{id:"arrival",title:"Arrival",favorite:!0},{id:"gladiator",title:"Gladiator",favorite:!0},{id:"spider-verse",title:"Into the Spider-Verse",favorite:!0},{id:"eeaao",title:"Everything Everywhere All at Once",favorite:!0,note:"Statistically improbable actions power the Donut Rule."},{id:"the-matrix",title:"The Matrix",favorite:!0},{id:"the-gentlemen",title:"The Gentlemen",favorite:!0},{id:"whiplash",title:"Whiplash",favorite:!0},{id:"v-for-vendetta",title:"V for Vendetta",favorite:!0},{id:"akira",title:"Akira",favorite:!0},{id:"shawshank",title:"The Shawshank Redemption",favorite:!0},{id:"interstellar",title:"Interstellar",favorite:!0},{id:"boy",title:"Boy",favorite:!0},{id:"dune-2",title:"Dune: Part Two",favorite:!0},{id:"memento",title:"Memento",favorite:!0},{id:"httyd",title:"How to Train Your Dragon",favorite:!0,note:"The original animated film."},{id:"se7en",title:"Se7en",favorite:!1},{id:"oldboy",title:"Oldboy",favorite:!1},{id:"cat-in-the-hat",title:"The Cat in the Hat",favorite:!1},{id:"the-rehearsal",title:"The Rehearsal",favorite:!1,note:"Nathan Fielder."},{id:"spirited-away",title:"Spirited Away",favorite:!1},{id:"kung-fu-panda",title:"Kung Fu Panda",favorite:!1},{id:"forrest-gump",title:"Forrest Gump",favorite:!1},{id:"lotr",title:"The Lord of the Rings",favorite:!1,note:"The Green Dragon Inn, and the title."},{id:"deadpool-wolverine",title:"Deadpool & Wolverine",favorite:!1},{id:"batman",title:"Batman",favorite:!1},{id:"watchmen",title:"Watchmen",favorite:!1},{id:"greek-myth",title:"Greek mythology",favorite:!1,note:"Medusa."}]});var Wl,j,fi,Vl,pi,mi,jl,Lr=$e(()=>{"use strict";Wl=[{id:"prologue",num:"Prologue",title:"The Night Before",tagline:"Five friends walk into a bar",hue:"magenta",summary:"A bachelor party at the Green Dragon Inn, a blackout, and a field. The ring and one mask are gone."},{id:"dragon",num:"Act I",title:"The Green Dragon",tagline:"Retrace the night. Pay the bill. Call the redhead.",hue:"green",summary:"Back to the bar: a confused Edward Norton, bullying suitors, an unpaid bill, and a phone number."},{id:"arrival",num:"Act II",title:"The Heptapods",tagline:"Three questions for Costello",hue:"violet",summary:"Louise leads them to a bean-shaped craft where Costello answers three questions."},{id:"route",num:"Act III",title:"No Way Out",tagline:"Plane or boat, Tyler is waiting",hue:"orange",summary:"Whichever way they choose, Tyler blows something up and the only way out is Odysseus."},{id:"island",num:"Act IV",title:"The Island",tagline:"What's in the box? Seven sins. Five donuts.",hue:"aqua",summary:"Hunger at sea, John Doe and Medusa, the seven deadly sins, and the feast."},{id:"hollywood",num:"Act V",title:"Hollywood",tagline:"You were on camera the whole time",hue:"yellow",summary:"Nathan Fielder reveals the documentary. Needles. A studio."},{id:"studio",num:"Act VI",title:"The Studio",tagline:"The gauntlet, the fourth mask, the ring",hue:"blue",summary:"Oh Dae-su, Toothless, (the Cat in the Hat), and finally Lou in Flynn's missing mask."},{id:"epilogue",num:"Epilogue",title:"Happily Ever After",tagline:"Donuts, improbable acts, a wedding",hue:"red",summary:"A donut shop outside the studio, a chance to revive friends, and a wedding in New Zealand."}],j=e=>({status:"upcoming",dmNote:"",...e}),fi=["goon-crowbar","goon-sledgehammer","goon-machete","goon-chainsaw","goon-taser"],Vl=[j({id:"prologue",act:"prologue",slate:"01",title:"The Bachelor Party",ref:"Prologue",slug:"INT. THE GREEN DRAGON INN, NEW ZEALAND \u2014 NIGHT",kind:"narration",minutes:[3,5],logline:"Five friends, one bachelor party, and a blackout. Narrate fragments only.",readAloud:["A stoner, a retard, a radish, a turtle, and a masked man walk into a bar.","Five friends gathered together, celebrating one of them getting married. It's the night of [[pc:flynn]]'s bachelor party. The men and distinguished creatures drink the night away at New Zealand's most infamous bar, The Green Dragon Inn.","Flynn shows off his collection of masks, at least the four he brought out to the bar. The stoner, [[pc:alex]], tries talking up one of the elven fairies but can't stop staring at her wings, weirding her out. The ground shakes as a big white sumo-wrestler-like figure with two tendrils on his face, [[pc:jamie]], attempts the dance from Deadpool & Wolverine. It's not going well.","The turtle, [[pc:haydn]], a nearly 1,000-year-old kung fu master, desperately tries to flag the bartender so he can order a vodka Red Bull and keep up with the other groomsmen. Sitting in a booster seat at one of the tables is an autistic boy who goes by the name of [[pc:goodwin]]; unlike Master Oogwaydn, he doesn't look his age and has a growth stunt.","This is the extent the five can remember."],notes:["This is mostly narrated. Do not spend 30 minutes roleplaying the previous night.","Do not reveal Lou taking the ring or the V mask. Do not show a clean memory of Louise.",'The blackout is useful: almost any weird continuity question can be answered with "you do not remember."'],cast:["nerissa","bartender"],films:["lotr","deadpool-wolverine"],source:`A stoner, a retard, a radish, a turtle, and a masked man walk into a bar.

Five friends gathered together. Celebrating one of them getting married. It's the night of Flynn's bachelor party.

The men and distinguished creatures drink the night away at New Zealand's most infamous bar, The Green Dragon Inn.

Flynn, shows off his collection of masks, at least the four he brought out to the bar. The stoner, "Dude Bro" tries talking up one of the elven fairies, but can't stop staring at her wings, weirding her out. The ground shakes as a big white sumo wrestler-like figure with two tendrils on his face attempts to do the dance from Deadpool & Wolverine, it's not going well. The turtle, a nearly 1,000-year-old kung fu master, desperately tries to flag the bartender, so he can order a vodka Redbull to keep up with the other groomsmen. Sitting in a booster seat at one of the tables, is an autistic boy who goes by the name of Forrest Gumpwin; unlike Master Oogwaydn, he doesn't look his age and has a growth stunt.

This is the extent the five can remember.`,next:["morning"],layout:{col:0,lane:0}}),j({id:"morning",act:"prologue",slate:"02",title:"The Next Morning",ref:"The Next Morning",slug:"EXT. A FIELD, SOMEWHERE IN NEW ZEALAND \u2014 MORNING",kind:"explore",minutes:[10,15],clock:"36h",clockTarget:36,logline:"Wake up in a field. The ring and a mask are missing. Start the 36-hour clock.",readAloud:["Flynn, wearing a Spider-Man mask stained with vomit, is woken up by a sheep. The enlightened spidey-senses from the mask combined with the hangover make waking up excruciatingly painful.","The other four men are passed out around a makeshift bonfire. Empty boxes, cans and bottles of beer are scattered around. As Flynn's eyes and spider-goggles adjust, he realizes the five of them passed out in the middle of a field.","Slowly each of them wakes up, groaning and staggering with pain. All of them blacked out, and all of them are suffering the consequences equally.","As Flynn looks through his bag to swap masks, he realizes something. His [[item:wedding-ring]] is gone. The ring he needs tomorrow is missing. He tells his friends to search their pockets, but no one finds anything. On top of that, he can only find two more masks, his [[item:batman-cowl]] and an [[item:inkblot-mask]]. He's missing a fourth, and he can't remember what it was."],beats:[{label:"Wake-up",text:"Flynn wakes up to a sheep, in a vomit-stained [[item:spider-mask]]. The others are passed out around a makeshift bonfire."},{label:"Group condition",text:"All five blacked out and suffer equally: [[cond:hangover]]."},{label:"Missing items",text:"The [[item:wedding-ring]] is gone. Only two other masks: [[item:batman-cowl]] and [[item:inkblot-mask]]. The [[item:v-mask|fourth mask]] is missing and forgotten."},{label:"Goal",text:"Return to The Green Dragon to locate the ring."}],objective:"Give each player one low-stakes reason to roll, then get them back to the bar.",mustHappen:["The group decides to return to [[scene:green-dragon|the Green Dragon]] to learn what happened."],rolls:[{stat:"agi",dc:10,label:"Run after something blowing away (Goodwin runs with advantage)"},{stat:"per",dc:8,label:"Find scattered belongings around the bonfire"},{stat:"any",dc:10,label:"A stupid physical stunt to retrieve a phone or bag"},{stat:"agi",dc:10,label:"Oogwaydn uses a branch as a staff to knock something out of a tree"}],tips:["[[pc:flynn]] can use [[ability:spider-sense]]. Answer: an angry sheep or farmer, or the urgency of getting back to the road.","[[pc:goodwin]] chases something the wind is carrying off: [[ability:run-gumpwin-run]].","[[pc:alex]] tries a stupid stunt to retrieve a phone or bag.","[[pc:haydn]] finds a branch: first chance to use [[ability:master-of-the-staff]].","[[pc:jamie]] may try a [[ability:spiritual-moment]] if he wants."],notes:["Nothing here should cause death."],failsafes:[{when:"They refuse to go back to the bar",then:"Their phones, receipts, memories, or a shouted complaint from a local point them there. Do not turn this into a second mystery."}],effects:[{kind:"clock",set:36,label:"Start the wedding clock at 36 hours"},{kind:"condition",id:"hangover",active:!0,label:"Everyone is hungover (\u22122 CHA, \u22122 PER)"}],cast:["sheep"],source:`Flynn, wearing a spiderman mask stained with vomit, is woken up by a sheep. The enlightened spidey-senses from the mask combined with the hangover make waking up excruciatingly painful. The other four men are passed out, surrounding a makeshift bonfire. Empty boxes, cans, and bottles of beer are scattered around. As Flynn's eyes and spider-goggles adjust, he realizes the five of them passed out in the middle of a field.

Slowly each of them wake up, groaning and staggered with pain. All of them blacked out and are suffering the consequences equally.

As Flynn looks through his bag to swap masks, he realizes something\u2026 His wedding ring is gone. The ring he needs tomorrow is missing. He tells each of his friends to search their pockets, but no one finds anything. On top of that, Flynn can only find two more masks, his batman cowl, and an inkblot face cover. He's missing a mask but can't remember what the fourth one was.

The group collectively decides to return to The Green Dragon to locate the whereabouts of the ring.`,next:["green-dragon"],layout:{col:1,lane:0}}),j({id:"green-dragon",act:"dragon",slate:"03",title:"The Green Dragon",ref:"Scene 1",slug:"INT. THE GREEN DRAGON INN \u2014 LATE MORNING",kind:"social",minutes:[35,50],clock:"33\u201335h",clockTarget:34,logline:"Question the patrons. Nobody knows about the ring. The only clue is the redhead.",readAloud:["The Green Dragon looks worse in daylight. The moment the five of you walk in, the bartender recognizes you. He picks up the phone, turns his back, tells someone that the rambunctious group from last night is back, and hangs up.",`He looks at you for a long moment. "You shouldn't stay long."`],beats:[{label:"Status effect",text:"Everyone has [[cond:hangover]]: \u22122 Charisma and \u22122 Perception."},{label:"Player goal",text:"Ask the bar patrons what happened last night and gather clues about the ring."},{label:"Scene clue",text:"No one knows anything specific about the ring. The only clue: [[clue:redhead]]."}],objective:"Learn one useful thing: [[clue:redhead|Flynn got the number of a redheaded woman last night]].",mustHappen:["Flynn eventually checks his phone and finds [[npc:louise]].","Do not let the players waste an hour interrogating people who do not know."],cast:["bartender","narrator","antinous","suitor-bow","suitor-shield","nerissa"],encounters:[{label:"Bar fight: Antinous & the Suitors",foes:["antinous","suitor-bow","suitor-shield"]}],rolls:[{stat:"cha",dc:10,label:"Get the bartender talking about last night"},{stat:"cha",dc:13,label:"Get the bartender to mention the redhead without hostility"},{stat:"per",dc:10,label:"Notice the bartender called someone the moment they walked in (or INT)"},{stat:"cha",dc:10,label:"Turn Antinous's teasing back on him"},{stat:"str",dc:12,label:"Physically intimidate Antinous and the suitors"},{stat:"per",dc:10,label:"Realize the only useful thing anyone said is about the woman (or INT)"},{stat:"cha",dc:20,label:"Alex vs. Nerissa: only a natural 20 gets anything"}],lines:[{by:"bartender",text:"You shouldn't stay long."},{by:"narrator",text:"I don't know you. I barely know me right now."},{by:"narrator",text:"Why does everyone keep asking me about last night?"},{by:"antinous",text:"You don't remember her? That's somehow worse. Give me the number."},{by:"suitor-bow",text:"She was out of your league even before the vomit mask."},{by:"nerissa",text:"No."},{by:"nerissa",text:"Still no."}],failsafes:[{when:"A roll with the bartender fails",then:"[[npc:michael-pearson]] arrives sooner."},{when:"Nobody thinks to check the phone",then:"A notification, an accidental call, or Antinous demanding the number. Keep it moving."},{when:"They kill a clue NPC",then:"Put the clue on their phone, in the environment, or in another NPC's mouth."}],notes:["The Narrator knows nothing. He is a red herring and setup for [[npc:tyler]]. The more they push, the more irritated he gets.","Do not let the Antinous side fight consume more than 2 rounds unless the table loves it.","Nerissa hates Dude Bro and knows nothing about the ring."],tips:["Mention a pool cue, a broom or a mop handle: something for [[pc:haydn]] to pick up as a [[item:staff]]."],loot:["antinous-sword","suitor-bow","suitor-dagger","suitor-shield"],effects:[{kind:"clues",ids:["redhead"],label:"Reveal the clue: Flynn has the redhead's number"},{kind:"npcs",ids:["bartender","narrator","antinous","suitor-bow","suitor-shield","nerissa"],patch:{status:"present"},label:"Mark the bar patrons as met"}],films:["the-odyssey","fight-club","lotr"],source:`All players have a charisma and perception negative modifier because they're hungover.

Characters in the bar:
* Bartender (Can look like anything) \u2014 As soon as the group walks into the bar, the bartender calls his boss on the phone to inform him that the rambunctious group from last night is back. After hanging up, all he says to the group is that they shouldn't stay long.
* Doesn't remember his name (Looks exactly like Edward Norton) \u2014 Looks a little beat up and tired. Has no recollection of who anyone is. Gets more and more irritated the more questions he asks. Doesn't know anything.
* Antinous (Robert Pattinson in the Odyssey) \u2014 Has a sword. Doesn't know where Flynn's ring went. Bullies Flynn to try to get the number of the woman that was hitting on Flynn last night (the red head).
* Suitor 1 (With Robert Pattinson, can look like anything) \u2014 Has a bow and arrow. Also teases Flynn about the woman being out of his league.
* Suitor 2 (With Robert Pattinson, can look like anything) \u2014 Has a shield and dagger.
* Nerissa (The elven fairy that turned down Dude Bro) \u2014 Doesn't know anything. Revolted by Dude Bro.

Players must ask the bar patrons about what happened last night to gather clues about where Flynn's ring went. No one knows anything specially about the ring, the only clue from this scene is that Flynn is the number of a red headed woman.`,next:["gentlemen","louise-call"],layout:{col:2,lane:0}}),j({id:"gentlemen",act:"dragon",slate:"04",title:"The Gentlemen",ref:"Boss Fight 1",slug:"INT. THE GREEN DRAGON INN \u2014 CONTINUOUS",kind:"boss",minutes:[10,20],clock:"32\u201334h",logline:"The owners want 500 gold for the damage. The party has 350. Negotiate or fight.",readAloud:["The front doors open. [[npc:michael-pearson]], [[npc:ray]] and [[npc:coach]] walk in like they own the place, because one of them does.","Michael is not happy about how you treated his establishment. He points, calmly, at the floor paneling Jam Radish broke trying to dance to NSYNC, and names his price: five hundred gold pieces."],beats:[{label:"Timing",text:"Can occur whenever the DM sees fit."},{label:"Entrance",text:"Michael Pearson, Ray and Coach walk in the front doors."},{label:"Conflict",text:"Michael owns the bar. He points out that [[pc:jamie]] broke the floor paneling dancing to NSYNC."},{label:"Demand",text:"500 gold pieces. The group collectively has [[item:gold|350]]."},{label:"Options",text:"Negotiate or fight."},{label:"Weapons",text:"The Gentlemen have three pistols."}],objective:"Settle a 500 gold bill with [[item:gold]].",mustHappen:["There is no single correct solution: negotiate, offer the 350, lie, intimidate, propose restitution, or fight."],cast:["michael-pearson","ray","coach"],encounters:[{label:"The Gentlemen",foes:["michael-pearson","ray","coach"]}],rolls:[{stat:"cha",dc:12,label:"Michael accepts 350 plus an insultingly worded promise that they leave immediately"},{stat:"cha",dc:15,label:"Michael reduces the bill to 350 and considers the matter closed"},{stat:"int",dc:12,label:"Find leverage in the bill or the damages: advantage on the next Charisma roll"}],lines:[{by:"michael-pearson",text:"You owe me five hundred. I am giving you the rare opportunity to decide whether the payment is financial."},{by:"michael-pearson",text:"That answer cost you the remaining fifty. Try again.",note:"After a bad negotiation roll"}],failsafes:[{when:"A negotiation roll goes badly",then:'Not instant murder. "That answer cost you the remaining fifty. Try again." Raise the demand or let Ray and Coach step closer.'},{when:"Natural 20",then:"Michael finds the audacity entertaining and lets them leave for 350, or another funny price you invent."}],notes:["If they fight: a beatable 2 to 4 round fight. Competent, not endgame monsters. Not intended to kill anybody.","The Gentlemen do not have to die. At 0 HP they can simply be unconscious.","If the players win, they can take 3 pistols with 6 shots each."],loot:["pistol-michael","pistol-ray","pistol-coach"],effects:[{kind:"items",ids:["gold"],patch:{qty:0},label:"Pay the 350 gold"},{kind:"items",ids:["pistol-michael","pistol-ray","pistol-coach"],patch:{state:"held",holder:"party"},label:"Take the three pistols (6 shots each)"},{kind:"npcs",ids:["michael-pearson","ray","coach"],patch:{status:"defeated"},label:"The Gentlemen are dealt with"}],films:["the-gentlemen"],source:`Can occur whenever the DM sees fit.

Michael Pearson, Ray and Coach (from The Gentlemen) walk into the front doors of the bar.

Michael Pearson is the owner and he is not happy about how the group treated his establishment. He points out that Jam Radish broke the floor paneling as he tried dancing to NSYNC.

Michael tells them they must pay 500 gold pieces. (The group collectively has 350)

The group can negotiate or fight. The Gentlemen have three pistols.`,next:["costello"],layout:{col:3,lane:-.6}}),j({id:"louise-call",act:"dragon",slate:"05",title:"The Phone Call",ref:"Phone Call",slug:"INT. WHEREVER FLYNN IS \u2014 ON THE PHONE",kind:"social",minutes:[5,10],clock:"32\u201334h",logline:"The redhead only answers calls. She flirts, is disappointed, and sends an address.",readAloud:["Flynn scrolls to the newest contact in his phone: **Louise Banks**, saved with a picture of Amy Adams. His texts go unanswered. He has to call."],beats:[{label:"Trigger",text:"Before or after the Gentlemen. Flynn looks up the woman's number on his [[item:flynn-phone|phone]]."},{label:"Contact",text:"Saved as [[npc:louise]], with a picture of Amy Adams. She will not answer texts, only a call."},{label:"Tone",text:"Very flirty. Talks about how much fun last night was, compliments his masks, says she has something else that could go on his face."},{label:"Ring question",text:"Flynn has to explain the situation and ask about the ring."},{label:"Result",text:"Disappointed, she says she has a friend who might help, and sends an address."}],objective:"Flynn explains the situation and asks about the ring.",mustHappen:["Louise sends an address. No roll is required: this is a required story transition."],cast:["louise"],rolls:[{stat:"cha",dc:12,label:"Flynn flirts back (hangover applies; he is masked unless he says otherwise)",note:"Suggested DC"}],lines:[{by:"louise",text:"You finally called. I was starting to think the masks were doing all the confidence for you."},{by:"louise",text:"You were very confident last night for a man who never showed his face."},{by:"louise",text:"I have something else that could go on your face.",note:"Then let Flynn react."},{by:"louise",text:"I know someone who experiences answers differently. Come alone if you want. Bring your friends if you have to."}],notes:["If Flynn takes his mask off for any reason, [[ability:unmasked]] applies immediately."],effects:[{kind:"clues",ids:["louise-address"],label:"Louise sends the address"},{kind:"npcs",ids:["louise"],patch:{status:"friendly"},label:"Louise is helping"}],films:["arrival"],source:`Can be before or after the encounter with The Gentlemen, Flynn must look up the woman's number on his phone. Her contact is saved as Louise Banks, with a picture of Amy Adams. She will not answer texts, only a phone call.

When she picks up, she's very flirty with Flynn and talks about how much fun last night was. She compliments his masks, but says that she has something else that could go on his face.

Flynn must explain the situation to her and ask about the ring. Even though she's disappointed, she says that she has a friend that might be able to help. She sends him an address.`,next:["costello"],layout:{col:3,lane:.6}}),j({id:"costello",act:"arrival",slate:"06",title:"Abbott & Costello",ref:"Transition 1",slug:"EXT. THE MIDDLE OF NOWHERE / INT. THE SHELL",kind:"oracle",minutes:[15,20],clock:"31\u201333h",clockTarget:32,logline:"A bean-shaped craft above an empty field. Flynn gets exactly three questions.",readAloud:["The group meets Louise in the middle of nowhere. She greets them and says they need to walk a bit to see her friend.","As thick clouds clear the sky, a massive bean-shaped spaceship floats above an empty field.","Louise takes them to the bottom of the craft, where a scissor lift elevates them into the main room. She introduces them to [[npc:abbott]] and [[npc:costello]], and allows Flynn to ask Costello three questions."],beats:[{label:"Meet-up",text:"After the Gentlemen, the group meets Louise in the middle of nowhere."},{label:"Arrival",text:"Clouds clear: a massive bean-shaped spaceship floats above an empty field."},{label:"Boarding",text:"A scissor lift elevates them into the main room."},{label:"Encounter",text:"Flynn may ask Costello three questions to help locate the ring."}],objective:"Flynn asks three questions. The riddle has to come out.",mustHappen:['If the first two questions do not reveal the riddle, the third answer must end with **"Out of the closet without a face."**',"After the third question, Abbott and Costello disappear.","The party now knows enough to decide how to reach Hollywood. Let them discuss plane vs. boat."],cast:["louise","abbott","costello"],lines:[{by:"costello",text:"The man who records what should not be recorded already wears what was yours.",note:"If Flynn asks who took it"},{by:"costello",text:"You meet the ring again beneath false sunlight in Hollywood.",note:"If Flynn asks where"},{by:"costello",text:"You are dead there. Most of you are speaking anyway.",note:"If Flynn asks whether they are safe"},{by:"costello",text:"Out of the closet without a face.",note:"If Flynn asks how to get it back"}],notes:["Costello is truthful but strange. He experiences time nonlinearly. Keep answers short.","If Flynn asks what the riddle means, Costello does not explain. The question still counts.","Do not over-explain how any of this works. Do not explain the riddle."],effects:[{kind:"clues",ids:["fact-thief"],label:"Revealed: Lou Bloom stole the ring"},{kind:"clues",ids:["fact-hollywood"],label:"Revealed: the ring and Lou are in Hollywood"},{kind:"clues",ids:["fact-death"],label:"Revealed: the group will die in Hollywood"},{kind:"clues",ids:["fact-riddle"],label:'Revealed: "Out of the closet without a face."'},{kind:"clock",set:32,label:"Set the clock to about 32 hours"}],films:["arrival"],source:`After dealing with The Gentlemen, the group meets up with Louise in the middle of nowhere. She greets them and says they need to walk a bit to see her friend.

As thick clouds clear the sky, a massive bean shaped spaceship floats above an empty field.

Louise takes them to the bottom of the craft, where a scissor lift elevates them into the main room.

Louise introduces the group to Abbott and Costello, she allows Flynn to ask Costello three questions to help him locate the ring.

The four things Costello can reveal:
* Lou Bloom stole the ring.
* The ring/Lous are in Hollywood.
* The group will die in Hollywood.
* The key to getting the ring and stopping Lou Bloom is "out of the closet without a face."

After the three questions, Abbott and Costello disappear. If Flynn doesn't ask the right questions, they must end with: "out of the closet without a face."

The group must decide how to get to Hollywood.`,next:["route-choice"],layout:{col:4,lane:0}}),j({id:"route-choice",act:"route",slate:"07",title:"Plane or Boat?",ref:"Travel Decision",slug:"EXT. THE ROAD OUT OF NOWHERE \u2014 DAY",kind:"decision",minutes:[2,5],logline:"The group decides how to get to Hollywood. Both routes end on Odysseus's boat.",readAloud:["The group must decide how to get to Hollywood."],objective:"Let the players pick. Do not tell them both roads lead to the sea.",mustHappen:["Whatever they choose, [[npc:tyler]] is waiting, and they end up sailing with [[npc:odysseus]]."],failsafes:[{when:"Alex tries to fly to Hollywood",then:"[[ability:bong-flight]] gives one magnificent airborne turn, then the high wears off over the harbor and he drops back onto the boat or dock."},{when:"Goodwin uses Gump Luck to find Hollywood directly",then:"He accidentally finds a sign, map or person that points toward Odysseus instead."},{when:"They steal a random boat without Odysseus",then:"They sail for hours and return to the same coastline, or realize they are completely lost. Odysseus is still the useful option."}],notes:["Protect the required story beat (reaching Hollywood by boat), not the exact route."],next:["airfield","docks"],layout:{col:5,lane:0}}),j({id:"airfield",act:"route",slate:"08A",title:"The Airfield",ref:"Scene 2.1",branch:"plane",slug:"EXT. AIRFIELD \u2014 DAY",kind:"boss",minutes:[25,40],clock:"28\u201330h",clockTarget:29,logline:"Tyler, five goons, a duel, and planes that explode no matter what.",readAloud:["Edward Norton is standing at the entrance of the airfield. He speaks a lot differently than he did at the bar: more confident, and cocky.","He reveals that he and Lou are in a club together. He recently lost a fight to Lou, so he owes him a favor, and he has agreed to help Lou by stopping you. Every aircraft is rigged with explosives.","Five goons step out of an airplane hangar with a crowbar, a sledgehammer, a machete, a chainsaw and a taser."],beats:[{label:"Tyler appears",text:"[[npc:tyler]] stands at the entrance of the airfield, more confident and cocky than at the bar."},{label:"Reveal",text:"[[clue:tyler-club]]"},{label:"Trap",text:"Every aircraft is rigged with explosives."},{label:"Goons",text:"Five goons step out of a hangar with a [[item:crowbar]], [[item:sledgehammer]], [[item:machete]], [[item:chainsaw]] and [[item:taser]]."},{label:"Duel",text:"Once the goons fall, Tyler tells Flynn: win a fist fight and he will disarm the bombs."},{label:"Forced outcome",text:"Win or lose, Tyler blows up the planes. The group must travel by boat."}],objective:"Beat the goons, then Flynn duels Tyler.",mustHappen:["Win or lose, Tyler blows up the planes. The party has to go to the boats."],cast:["tyler",...fi],encounters:[{label:"Five goons",foes:fi},{label:"Duel: Flynn vs. Tyler",foes:["tyler"],fighters:["flynn"]}],rolls:[{stat:"per",dc:12,label:"Spot the explosives"}],lines:[{by:"tyler",text:"Lou beat me. I owe him one. You're the one."},{by:"tyler",text:"You keep thinking winning means I have to keep my word."},{by:"tyler",text:"You won the fight. You didn't win an airplane.",note:"After Flynn wins the duel"}],tips:["[[pc:goodwin]] can run through the hangar.","[[pc:haydn]] can grab a broom, a pipe or a tool handle.","[[pc:alex]] can use [[ability:bong-flight]].","[[pc:jamie]] can request a [[ability:spiritual-moment]].","[[pc:flynn]] can switch masks based on the threat."],notes:["Keep the goon fight fast. They exist so everyone gets to use combat toys.","No weapons in the duel unless Flynn cheats.","If they defeated the goons, they can take the surviving weapons."],loot:["crowbar","sledgehammer","machete","chainsaw","taser"],effects:[{kind:"clues",ids:["tyler-club"],label:"Revealed: Tyler owes Lou a favor"},{kind:"npcs",ids:fi,patch:{status:"defeated"},label:"The goons are down"},{kind:"items",ids:["crowbar","sledgehammer","machete","chainsaw","taser"],patch:{state:"held",holder:"party"},label:"Loot the goon weapons"},{kind:"npcs",ids:["tyler"],patch:{status:"fled"},label:"Tyler blows the planes and walks away"},{kind:"clock",set:29,label:"Set the clock to about 29 hours"}],films:["fight-club"],source:`IF THE GROUP DECIDES TO TRAVEL BY PLANE

Edward Norton is at the airport, he stands at the entrance of the airfield. He speaks a lot differently than he did at the bar, more confident and cocky. He reveals that he and Lou are in a club together, and recently he lost a fight to Lou, so he owes him a favor.

He's agreed to help Lou, by stopping the group. Every aircraft is rigged with explosives. Five goons (can look like anything) step out from an airplane hanger with various weapons (crowbar, sledgehammer, machete, chainsaw, and a taser)

When the group defeats the goons, Tyler (Edward Norton) tells Flynn that if he can win in a fist fight, he will disarm the bombs.

Win or lose, Tyler blows up the planes. The group must decide to travel by boat.`,next:["harbor"],layout:{col:6,lane:-.7}}),j({id:"harbor",act:"route",slate:"09",title:"Odysseus",ref:"Transition 2.1",branch:"plane",slug:"EXT. THE HARBOR \u2014 DAY",kind:"travel",minutes:[5,10],logline:"With the planes gone, Odysseus offers a ride to California.",readAloud:["[[npc:odysseus]] and his men are getting ready to disembark on a voyage. They plan on going to California to see the premiere of Anne Hathaway's new movie. Odysseus welcomes the group to come along."],cast:["odysseus","odysseus-crew"],lines:[{by:"odysseus",text:"California is west. Eventually."},{by:"odysseus",text:"I've been lost longer than you've been married, which apparently is not at all. Get on the boat."}],effects:[{kind:"npcs",ids:["odysseus","odysseus-crew"],patch:{status:"friendly"},label:"Odysseus and his men take them aboard"}],films:["the-odyssey"],source:`Odysseus and his men are getting ready to disembark on a voyage. They plan on going to California to see the premiere of Anne Hathaway's new movie. Odysseus welcomes the group to come along.

GO TO TRANSITION 3`,next:["voyage"],layout:{col:7,lane:-.7}}),j({id:"docks",act:"route",slate:"08B",title:"The Docks",ref:"Scene 2.2",branch:"boat",slug:"EXT. THE DOCKS \u2014 DAY",kind:"boss",minutes:[25,40],clock:"28\u201330h",clockTarget:29,logline:"Odysseus offers a ride, Tyler rigs the boats, and Flynn fights for them.",readAloud:["[[npc:odysseus]] and his men are getting ready to disembark on a voyage. They plan on going to California to see the premiere of Anne Hathaway's new movie. Odysseus welcomes the group to come along.","Before anyone gets onto the boats, Edward Norton steps onto the docks. He speaks a lot differently than he did at the bar: more confident and cocky. He reveals that he and Lou are in a club together, that he recently lost a fight to Lou, and that he owes him a favor.","Every boat is rigged with explosives. Tyler makes Flynn a deal: beat him in a fist fight, one on one, and he will disarm them."],beats:[{label:"Odysseus",text:"Odysseus offers the group a ride to California."},{label:"Tyler appears",text:"[[npc:tyler]] steps onto the docks before anyone boards."},{label:"Reveal",text:"[[clue:tyler-club]]"},{label:"Trap",text:"Every boat is rigged with explosives."},{label:"Duel",text:"If Flynn beats him one on one, Tyler will disarm the explosives."},{label:"Fail-safe",text:"If Flynn is about to lose, Odysseus shoots Tyler in the head with an arrow. The [[npc:narrator]] pops back into consciousness and helps disarm the bombs."}],objective:"Flynn duels Tyler for the boats.",mustHappen:["The party departs with Odysseus."],cast:["odysseus","odysseus-crew","tyler"],encounters:[{label:"Duel: Flynn vs. Tyler",foes:["tyler"],fighters:["flynn"]}],rolls:[{stat:"per",dc:12,label:"Spot the explosives"},{stat:"int",dc:10,label:"Disarm the bombs with the Narrator's help"}],lines:[{by:"tyler",text:"Lou beat me. I owe him one. You're the one."},{by:"narrator",text:"Why am I on a dock? Why is there an arrow in me?",note:"After Odysseus's arrow"},{by:"odysseus",text:"I've been lost longer than you've been married, which apparently is not at all. Get on the boat."}],failsafes:[{when:"Flynn wins",then:"Tyler stalls, lies, or reaches for the detonator. Odysseus and his men help secure the boat."},{when:"Flynn has a bad roll and is clearly losing",then:"Odysseus shoots Tyler in the head with an arrow. The Narrator returns, horrified and confused, and helps disarm the explosives."}],notes:["Do not spend long on bomb-disarming rules. One successful roll with the Narrator's help is enough."],effects:[{kind:"clues",ids:["tyler-club"],label:"Revealed: Tyler owes Lou a favor"},{kind:"npcs",ids:["tyler"],patch:{status:"defeated"},label:"Tyler is down (arrow or fists)"},{kind:"npcs",ids:["odysseus","odysseus-crew"],patch:{status:"friendly"},label:"Odysseus and his men take them aboard"},{kind:"clock",set:29,label:"Set the clock to about 29 hours"}],films:["fight-club","the-odyssey"],source:`IF THE GROUP DECIDES TO TRAVEL BY BOAT

Odysseus and his men are getting ready to disembark on a voyage. They plan on going to California to see the premiere of Anne Hathaway's new movie. Odysseus welcomes the group to come along.

Before anyone gets onto the boats, Edward Norton steps onto the docks. He speaks a lot differently than he did at the bar, more confident and cocky. He reveals that he and Lou are in a club together, and recently he lost a fight to Lou, so he owes him a favor.

He's agreed to help Lou, by stopping the group. Every boat is rigged with explosives.

Tyler (Edward Norton) makes a deal with Flynn, if he can beat him in a fist fight, one on one, he'll disarm the explosives.

If Flynn has a bad roll, and is about to lose, Odysseus will shoot Tyler with an arrow in the head. This will activate the Narrator to pop back into consciousness and help disarm the bombs.`,next:["voyage"],layout:{col:6.5,lane:.7}}),j({id:"voyage",act:"island",slate:"10",title:"The Voyage",ref:"Transition 3",slug:"EXT. OPEN SEA \u2014 DAY",kind:"travel",minutes:[10,15],clock:"18\u201322h",clockTarget:20,logline:"Redistribute gear, get hungry, spot an island.",readAloud:["Odysseus, his men, and the group have set sail.","It's been a few hours. Charisma, perception, and now agility are suffering from the lack of food.","Odysseus points out an island up ahead where they can stop to search for food. It's jungle-like, with tropical trees and dense forest. The group, Odysseus and five of his men make their way into a clearing.","Seven stone buildings stand in a semicircle. In the middle of them, a bald man is packaging a small box."],beats:[{label:"Voyage",text:"Odysseus, his men and the group have set sail."},{label:"Equipment",text:"Weapons from the bar ([[item:antinous-sword]], [[item:suitor-dagger]], [[item:suitor-shield]], [[item:suitor-bow]]), the Gentlemen's pistols (limited bullets), goon weapons from the airfield, and [[item:odysseus-swords]]."},{label:"Status effect",text:"After a few hours: [[cond:hunger]] on top of [[cond:hangover]]."},{label:"Food stop",text:"Odysseus points out an island ahead."},{label:"Island",text:"Jungle, tropical trees, dense forest. The group, Odysseus and five of his men head for a clearing."},{label:"Clearing",text:"Seven stone buildings in a semicircle. In the middle, a bald man packaging a small box."}],objective:"Let players redistribute equipment, then make the food stop feel important.",rolls:[{stat:"any",dc:10,label:"Improvised boat task (DC 8 to 12)"}],notes:["They are now operating at \u22122 Charisma, \u22122 Perception and \u22122 Agility. This should feel awful.","Boat oars and poles count as staffs for [[pc:haydn]]."],cast:["odysseus","odysseus-crew"],loot:["odysseus-swords","oars"],effects:[{kind:"condition",id:"hunger",active:!0,label:"Hunger sets in (\u22122 AGI)"},{kind:"items",ids:["odysseus-swords"],patch:{state:"held",holder:"party"},label:"Hand out Odysseus's spare swords"},{kind:"clock",set:20,label:"Set the clock to about 20 hours"}],films:["the-odyssey"],source:`Odysseus, his men, and the group have set sail.
