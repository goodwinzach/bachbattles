At this point the group can be equipped with weapons from the bar (sword, dagger, shield, bow and arrow), pistols (three, from The Gentlemen, limited bullets), goon weapons (from the airport) or spare swords from Odysseus' men.

It's been a few hours, now, charisma, perception, and now agility is negatively affected because of lack of food.

Odysseus points out that there's an island up ahead they can stop at to search for food.

When they arrive, it's a jungle-like island, with tropical trees and dense forestry. The group, Odysseus and five of his men make their way into a clearing.

There's seven stone buildings in a semi circle formation. In the middle center of the buildings is a bald man packaging a small box.`,next:["john-doe"],layout:{col:8,lane:0}}),j({id:"john-doe",act:"island",slate:"11",title:"What's in the Box?",ref:"Scene 3",slug:"EXT. ISLAND CLEARING \u2014 AFTERNOON",kind:"boss",minutes:[15,25],logline:"John Doe, Medusa's head, and an inverted Perception check.",readAloud:["The bald man looks up from his box. He introduces himself as John Doe. There is plenty of food on the island, he says, but first they must answer a question.",`"What's in the box?"`],beats:[{label:"Introduction",text:`[[npc:john-doe]] says there is plenty of food, but first: "What's in the box?"`},{label:"Who can open it",text:"Only one player. **It cannot be Flynn.** Not Odysseus or his men either. Only [[pc:alex]], [[pc:goodwin]], [[pc:haydn]] or [[pc:jamie]]."},{label:"Box result",text:"Whoever opens [[item:the-box]] turns to stone and is out for the rest of the scene. John Doe picks up [[item:medusa-head]]."},{label:"Lou connection",text:"[[clue:lou-island]]"},{label:"Flynn immunity",text:"While wearing any mask, Flynn cannot be affected by Medusa's curse."},{label:"Other groomsmen",text:"If they look at Medusa, they roll Perception. Low Perception is good here."},{label:"Odysseus & men",text:"They also roll and can be turned to stone."},{label:"Fight",text:"Defeat John Doe. Flynn is the only one who can approach. It can be a very easy defeat."},{label:"Afterward",text:"They still need food: search the seven stone buildings, one for each deadly sin."}],objective:"Defeat John Doe and neutralize Medusa. Then search the buildings for food.",mustHappen:["Only one groomsman may open the box. Whoever does is turned to stone for the rest of this encounter.","When John Doe is defeated and the head is covered, neutralized or destroyed, everyone turned to stone returns to normal."],cast:["john-doe","odysseus","odysseus-crew"],encounters:[{label:"John Doe",foes:["john-doe"]}],rolls:[{stat:"per",dc:11,inverted:!0,label:"Look at Medusa's gaze",note:"10 or lower: safe, they fail to notice her eyes. 11 or higher: turned to stone. Tell players after the first roll that this is intentionally backwards."},{stat:"any",dc:12,label:"An indirect anti-Medusa stunt (throwing something while looking away, etc.)"}],lines:[{by:"john-doe",text:"What's in the box?",note:"Casual. Never shouted."},{by:"john-doe",text:"Lou stopped by too. In return for protection, he gave John head.",note:"Let the joke sit for a second."}],tips:["Ghosts distract him.","Throw objects while looking away.","[[pc:jamie]] uses a [[ability:spiritual-moment]] (a gust closes someone's eyes).","[[pc:haydn]] knocks something over with a staff without looking.","[[pc:alex]] flies for a turn with his eyes covered.","[[pc:goodwin]] uses [[ability:gump-luck]] for an absurd coincidence."],notes:["Only Flynn can safely approach while Medusa is exposed. John Doe is deliberately fragile; the danger is getting to him.","Do not require Flynn to solo every hit if the party invents a smart indirect approach.","Odysseus and his men roll as one group. A bad result can turn some or all of them to stone."],secrets:["**From here on, stop protecting players from death.** Bad choices and bad rolls may kill them. Ghosts keep playing, and donuts are waiting in [[scene:gluttony]]."],effects:[{kind:"clues",ids:["lou-island"],label:"Revealed: Lou passed through the island"},{kind:"npcs",ids:["john-doe"],patch:{status:"defeated"},label:"John Doe is defeated"},{kind:"items",ids:["medusa-head"],patch:{state:"destroyed",holder:""},label:"Medusa's head is neutralized"},{kind:"pcs",filter:"stone",patch:{status:"alive"},label:"Everyone turned to stone returns to normal"}],films:["se7en","greek-myth"],source:`The group can ask the bald man if and where they can get some food. He introduces himself as John Doe, and says that there's plenty of food on the island but first, they must answer the question: What's in the box?

Only one player can open the box, IT CANNOT BE FLYNN. John Doe won't allow Flynn or Odysseus/his men to open the box. He will only let one of the four groomsmen open it (Dude Bro, Gumpwin, Oogwaydn, or Jam Radish)

The group can decide amongst themselves. Whoever it is, opens the box and turns the stone. The player is out for the rest of the scene. John Doe picks up medusa's head from inside the box.

John Doe explains that Lou Bloom also stopped by, and in return for protection, he gave John head.

By wearing any of the masks, Flynn cannot be affected by medusa's curse. If the remaining three groomsmen look at Medusa (roll for perception) they are also turned to stone. Low perception is good in this case.

Odysseus/his men also have to roll and can be turned to stone.

The group must defeat John Doe / Medusa, Flynn is the only one who can approach. It can be a very easy defeat.

After John Doe is defeated, the group must still acquire food. They must pick and search the stone buildings, each of them containing a representation of the 7 deadly sins, another character or force they must fight and overcome.`,next:["pride"],layout:{col:9,lane:0}}),j({id:"pride",act:"island",slate:"12",title:"Pride",ref:"Seven Deadly Sins",slug:"INT. STONE BUILDING \u2014 PRIDE",kind:"boss",minutes:[10,20],logline:"Always the first room. A creepy reunion and thirty knives.",readAloud:["They open the door to the first building. In the middle of the room is a man sharpening a knife, beside a table of over thirty different knives.","He turns around. It's David Frame. He looks at the masked man and immediately says, in a calm, creepy voice:",`"Flynn, is that you? Still wearing masks huh? It's been awhile man, how come you haven't reached out? I've been wanting to show you some new tricks I've learned."`,"He lunges at Flynn."],objective:"Survive David Frame.",mustHappen:["**No matter which building they choose or what they roll, the first room is PRIDE.**","After David is defeated, they pick or roll for the next building. The sequence ends with [[scene:gluttony|GLUTTONY]]."],cast:["david-frame"],encounters:[{label:"David Frame",foes:["david-frame"]}],lines:[{by:"david-frame",text:"Flynn, is that you? Still wearing masks huh? It's been awhile man, how come you haven't reached out? I've been wanting to show you some new tricks I've learned."}],tips:["Knock over the knife table.","Use the [[item:batman-cowl]]'s accuracy to shoot a knife out of his hand.","[[pc:haydn]] grabs a table leg.","Ghosts pretend to grab knives and confuse him."],notes:["Personal and creepy rather than epic.","David focuses Flynn first but attacks anybody who interferes.","Pacing: Pride, then 1 to 3 more rooms, then Gluttony. Play more if the table is loving it."],loot:["knives"],effects:[{kind:"npcs",ids:["david-frame"],patch:{status:"defeated"},label:"David Frame is defeated"},{kind:"items",ids:["knives"],patch:{state:"held",holder:"party"},label:"Take some knives"}],source:`NO MATTER HOW THEY CHOOSE OR WHAT THEY ROLL, THE FIRST BUILDING THEY ENTER IS PRIDE.

They open the door to the first building, and in the middle of the room is a man sharpening a knife. He's a table with over 30 different knives. He turns around, it's David Frame. He looks at the masked man, and immediately assumes and says in a calm/creepy voice: "Flynn, is that you? Still wearing masks huh? It's been awhile man, how come you haven't reached out? I've been wanting to show you some new tricks I've learned." He lunges at Flynn and tries to stab him.

After David is defeated, they can randomly pick or roll to see what building they go into, the scene is over when they pick gluttony.`,next:["lust","greed","envy","wrath","sloth","gluttony"],layout:{col:10,lane:0}}),j({id:"lust",act:"island",slate:"13A",title:"Lust",ref:"Seven Deadly Sins",optional:!0,slug:"INT. STONE BUILDING \u2014 LUST",kind:"social",minutes:[5,10],logline:"Naked gladiators enthusiastically try to seduce the party. Keep it brief.",readAloud:["Inside: a bunch of naked gladiators. They are delighted to see the group, and they make their intentions very clear."],objective:"Get out. Charm, trick, run, or fight.",cast:["gladiator-1","gladiator-2","gladiator-3"],encounters:[{label:"Lust Gladiators",foes:["gladiator-1","gladiator-2","gladiator-3"]}],rolls:[{stat:"cha",dc:10,label:"Politely redirect them"},{stat:"cha",dc:12,label:"Convince them someone else is coming"},{stat:"agi",dc:10,label:"Simply escape the room"}],failsafes:[{when:"A Charisma roll fails",then:"No explicit roleplay required. The gladiators block the exit, and the party must shove, fight or escape."}],notes:["Do not over-describe this. The joke is the premise."],effects:[{kind:"npcs",ids:["gladiator-1","gladiator-2","gladiator-3"],patch:{status:"defeated"},label:"Escaped the gladiators"}],films:["gladiator"],source:"LUST - A bunch of naked gladiators that want to have sex with the group",next:["gluttony"],layout:{col:11,lane:-2}}),j({id:"greed",act:"island",slate:"13B",title:"Greed",ref:"Seven Deadly Sins",optional:!0,slug:"INT. STONE BUILDING \u2014 GREED",kind:"boss",minutes:[10,15],logline:"Counterfeit money, cases of alcohol, and a man throwing beer bottles.",readAloud:["Stacks of counterfeit money. Cases of alcohol. And [[npc:ted-terger]], guarding both. He picks up a beer bottle."],objective:"Get past Ted, by force or by deal.",cast:["ted-terger"],encounters:[{label:"Ted Terger",foes:["ted-terger"]}],rolls:[{stat:"cha",dc:12,label:"Distract him with a fake deal"},{stat:"agi",dc:12,label:"Steal something while he talks"},{stat:"int",dc:12,label:"Recognize the money is counterfeit and use it as leverage"}],notes:["Possible solutions: fight, steal money during a distraction, bargain with gold, or convince Ted they are only there for the alcohol.","Loot is joke props only. Neither should solve a major later problem."],loot:["counterfeit-cash","alcohol-case"],effects:[{kind:"npcs",ids:["ted-terger"],patch:{status:"defeated"},label:"Ted Terger is dealt with"},{kind:"items",ids:["counterfeit-cash","alcohol-case"],patch:{state:"held",holder:"party"},label:"Grab the joke props"}],films:["stitched"],source:"GREED - Ted Terger with stacks of counterfeit money and cases of alcohol. He throws beer bottles at the group as an attack.",next:["gluttony"],layout:{col:11,lane:-1}}),j({id:"envy",act:"island",slate:"13C",title:"Envy",ref:"Seven Deadly Sins",optional:!0,slug:"INT. STONE BUILDING \u2014 ENVY",kind:"social",minutes:[5,10],logline:"Truman just wants out. If they leave him alone, he steals a boat.",readAloud:["Truman has been stuck in this building ever since he escaped the Truman world. He does not attack. He is desperate to get out and see the world.",'"Hollywood is real, right? Like actually real?"'],objective:"Decide what to do with Truman.",cast:["truman"],encounters:[{label:"Truman (only if they attack him)",foes:["truman"]}],lines:[{by:"truman",text:"Hollywood is real, right? Like actually real?"}],notes:["They can let him follow, lie to him, lock him in, threaten him, or kill him for no reason.","If they leave him alive and unattended, Truman later steals a boat. No strategic punishment. It is just funny."],effects:[{kind:"clues",ids:["truman-boat"],label:"Truman steals a boat (left alive and unattended)"},{kind:"npcs",ids:["truman"],patch:{status:"fled"},label:"Truman is gone"}],films:["truman-show"],source:"ENVY - Truman from the Truman Show, he's been stuck in the building ever since he escaped the Truman world. Does not attack, is just very desperate to get out and see the world. Steals a boat if the group doesn't kill him. (basically no consequence just funny)",next:["gluttony"],layout:{col:11,lane:0}}),j({id:"wrath",act:"island",slate:"13D",title:"Wrath",ref:"Seven Deadly Sins",optional:!0,slug:"INT. STONE BUILDING \u2014 WRATH",kind:"boss",minutes:[10,15],logline:"Kingpin only cares if Flynn is wearing the Spider-Man mask.",readAloud:["A huge man fills most of the room. [[npc:kingpin]]. He turns, slowly, and looks at Flynn's face."],objective:"Survive Kingpin, or make him not care.",cast:["kingpin"],encounters:[{label:"Kingpin",foes:["kingpin"]}],lines:[{by:"kingpin",text:"Spider-Man.",note:"Only if Flynn is wearing the Spider-Man mask. That is enough."}],notes:["If Flynn enters wearing the Batman cowl or the inkblot mask, Kingpin stares, grunts, and does not care.","If Flynn switches into the Spider-Man mask inside, Kingpin immediately becomes furious."],secrets:["Clever solution: Flynn removes or switches the [[item:spider-mask]] and Kingpin's aggression collapses. Do not explain this unless the players notice."],effects:[{kind:"npcs",ids:["kingpin"],patch:{status:"defeated"},label:"Kingpin is dealt with"}],films:["spider-verse"],source:"WRATH - Kingpin from Spider-man. Only attacks if Flynn is wearing Spider-man mask",next:["gluttony"],layout:{col:11,lane:1}}),j({id:"sloth",act:"island",slate:"13E",title:"Sloth",ref:"Seven Deadly Sins",optional:!0,slug:"INT. STONE BUILDING \u2014 SLOTH",kind:"boss",minutes:[10,15],logline:"He doesn't want to take any pills. He does want to shoot you with a lightning rifle.",readAloud:["Cypher is lounging on a couch with a lightning rifle across his lap. He tells the group he doesn't want to take any pills, and immediately opens fire."],objective:"Get to Cypher, or get the rifle away from him.",cast:["cypher"],encounters:[{label:"Cypher",foes:["cypher"]}],rolls:[{stat:"int",dc:12,label:"Unplug whatever is powering the rifle"},{stat:"agi",dc:12,label:"Knock the rifle away (or STR)"}],tips:["Fill the room with couches, cables, plugs and electronic equipment so players can improvise.","Use cover to close the distance."],loot:["lightning-rifle"],effects:[{kind:"npcs",ids:["cypher"],patch:{status:"defeated"},label:"Cypher is defeated"},{kind:"items",ids:["lightning-rifle"],patch:{state:"held",holder:"party"},label:"Take the lightning rifle"}],films:["the-matrix"],source:"SLOTH - Cyper from the matrix, tells the group he doesn't want to take any pills and immediately attacks with lighting rifle",next:["gluttony"],layout:{col:11,lane:2}}),j({id:"gluttony",act:"island",slate:"14",title:"Gluttony",ref:"Seven Deadly Sins",slug:"INT. STONE BUILDING \u2014 GLUTTONY",kind:"boss",minutes:[20,30],logline:"The island climax. Win the fight, eat everything, find five donuts.",readAloud:["A grotesque room overflowing with food. [[npc:baron]] sits in an oil bath in the middle of it.","[[npc:feyd]] and [[npc:rabban]] step out from either side of him, daggers drawn."],objective:"Defeat the three Harkonnens, then eat.",mustHappen:["The island sequence ends when they clear Gluttony and get the food and **five donuts**."],cast:["baron","feyd","rabban"],encounters:[{label:"The Harkonnens",foes:["baron","feyd","rabban"]}],tips:["Overturn tables for cover.","Throw food.","Spill the oil.","Use fire, if they are willing to create chaos.","Climb fixtures.","Hanging chains or kitchen tools make Oogwaydn weapons."],notes:["This is allowed to be lethal.","Feyd attacks the fastest or most skilled-looking player. Rabban attacks whoever is closest. The Baron stays back and commands or splashes oil.",`**Donut tutorial:** if anyone is a ghost, this is the perfect first place to use the [[rule:donut-rule]]. Explain it clearly: "The donut isn't enough. Somebody alive has to do something statistically improbable in real life." Be generous if it is funny and committed.`],loot:["feast","donuts","dr-pepper"],effects:[{kind:"npcs",ids:["baron","feyd","rabban"],patch:{status:"defeated"},label:"The Harkonnens are defeated"},{kind:"healAll",label:"The feast: every living player returns to full HP"},{kind:"condition",id:"hangover",active:!1,label:"Hangover ends"},{kind:"condition",id:"hunger",active:!1,label:"Hunger ends"},{kind:"items",ids:["feast"],patch:{state:"spent"},label:"The feast is eaten"},{kind:"items",ids:["donuts"],patch:{state:"held",holder:"party",qty:5},label:"Find 5 donuts"},{kind:"items",ids:["dr-pepper"],patch:{state:"held",holder:"goodwin"},label:"Goodwin finds the Dr Pepper"}],films:["dune-2"],source:"GLUTTONY - Baron Harkonnen in his oil bath, the room is full of food, Feyd-Rautha and Beast Rabban attack with daggers. After the three are defeated, the group can eat and obtain 5 donuts. They can revive dead characters with the donuts.",next:["fielder"],layout:{col:12,lane:0}}),j({id:"fielder",act:"hollywood",slate:"15",title:"Nathan Fielder",ref:"Transition 4",slug:"EXT. HOLLYWOOD HARBOR \u2014 DUSK",kind:"social",minutes:[15,20],clock:"8\u201312h",clockTarget:10,logline:"You have been on camera the whole time. Then the camcorders fire needles.",readAloud:["The group and the last of Odysseus's men get back on the boats and set sail for Hollywood, California.","When they arrive, [[npc:nathan-fielder]] and a camera crew are waiting. Nathan wears his laptop holder, but the screen faces away from him. He plays a video.","It's Lou. He reveals that they have been on camera the entire time; Nathan and his team have been secretly recording everything. Lou has partnered with Nathan to make the greatest and most tragic documentary about five friends who die heroically.","The video stops. Nathan explains that Lou tricked him, and that he is being held hostage. He is scared for his life.","Then the cameramen raise their camcorders and fire a seductive needle shot directly at the group."],beats:[{label:"Set sail",text:"The group and the last of Odysseus's men sail for Hollywood."},{label:"Nathan Fielder",text:"Nathan and a camera crew greet them. Laptop holder, screen facing away."},{label:"Lou video",text:"[[clue:documentary]]"},{label:"Nathan reveal",text:"Lou tricked Nathan and is holding him hostage. He is scared for his life."},{label:"Paralysis",text:"The cameramen, using decoy camcorders, fire needles. Everyone is paralyzed and knocked out."}],objective:"Deliver the reveal, then the capture.",mustHappen:["Everyone is paralyzed and knocked out. This is a required capture."],cast:["nathan-fielder","camera-crew","lou"],rolls:[{stat:"per",dc:12,label:"Notice the camera barrels are wrong"},{stat:"agi",dc:15,label:"Dodge the first needle"}],lines:[{by:"lou",text:"You kept giving me better material than I could have directed.",note:"On the video"},{by:"nathan-fielder",text:"So there was a misunderstanding where I thought we were making a documentary and Lou thought we were making evidence."},{by:"nathan-fielder",text:"I am technically also being held hostage, although I did sign a release."},{by:"nathan-fielder",text:"I thought there would be more consent paperwork before the deaths."}],failsafes:[{when:"A player succeeds",then:"It does not escape the scene. They dodge one needle and get hit by another, knock one operator down before collapsing, or stay conscious long enough to see where they are taken."},{when:"A player fails",then:"Immediate knockout."}],notes:["This is the first time the players fully understand the scale of Lou's plan.","Play Nathan's discomfort. Long pauses.","If Truman stole a boat, mention an empty dock or a tiny boat disappearing in the distance as they leave the island."],effects:[{kind:"clues",ids:["documentary"],label:"Revealed: the documentary"},{kind:"pcs",filter:"all",patch:{status:"down"},label:"Everyone is knocked out"},{kind:"clock",set:10,label:"Set the clock to about 10 hours"}],films:["the-rehearsal","nightcrawler"],source:`The group and the last of Odysseus/his men get back on the boats. They set sail for Hollywood, California.

When they arrive, they're greeted by Nathan Fielder and a camera crew. Nathan Fielder wears his laptop holder but with the screen facing away from him. He plays a video of Lou revealing that they've been on camera the entire time, Nathan and his team have been secretly recording the entire time. Lou explains that he's partnered with Nathan to make the greatest and most tragic documentary about 5 friends who die heroically.

After the video stops, Nathan explains that Lou tricked him and that he's being held hostage by Lou. He's scared for his life.

The cameramen (using decoy camcorders) shoot a seductive needle shot directly at the group. Everyone is paralyzed and knocked out.`,next:["volume"],layout:{col:13,lane:0}}),j({id:"volume",act:"hollywood",slate:"16",title:"The Volume",ref:"Transition 4",slug:"INT. MOVIE STUDIO, THE VOLUME \u2014 NIGHT",kind:"narration",minutes:[5,8],clock:"\u22122h",logline:"Wake up in a studio ringed by cameras. Lou is on the LED wall.",readAloud:["They wake up in a massive movie studio built around a Volume LED screen. Lights and cameras are all positioned toward the group.","Lou's face suddenly appears, stretched across the LED wall. He yells at them to wake up already. He's been waiting for two hours.","As they come to, he says they're lucky he let them keep their gear. He didn't want to mess up the continuity between scenes.",'"I want you to meet an old boyfriend of mine."'],beats:[{label:"Studio",text:"A massive movie studio with a Volume LED screen. Lights and cameras point at the group."},{label:"Lou screen",text:"Lou, stretched across the LED wall, yells at them to wake up. He has waited two hours."},{label:"Continuity",text:"They are lucky he let them keep their gear. He did not want to mess up continuity."},{label:"Introduction",text:"He wants to introduce an old boyfriend of his."}],cast:["lou"],lines:[{by:"lou",text:"Two hours. I had to shoot inserts while you were unconscious."},{by:"lou",text:"Continuity matters. That's why I let you keep the weapons."},{by:"lou",text:"I want you to meet an old boyfriend of mine."}],effects:[{kind:"pcs",filter:"down",patch:{status:"alive"},label:"Everyone wakes up"},{kind:"clockDelta",delta:-2,label:"Lose two hours on the clock"}],films:["nightcrawler"],source:`They wake up in a massive movie studio with a volume LED screen in it. Lights and cameras are also positioned towards the group.

Lou's face stretched out on the LED screen suddenly appears and he yells at them to wake up already. He's been waiting for 2 two hours.

As they wake up, he says that they're lucky he let them keep their gear, he didn't want to mess up the continuity between scenes.

He says that he wants to introduce an old boy friend of his.`,next:["oh-dae-su"],layout:{col:14,lane:0}}),j({id:"oh-dae-su",act:"studio",slate:"17",title:"Oh Dae-su",ref:"Scene 3 (Hollywood)",slug:"INT. THE VOLUME \u2014 CONTINUOUS",kind:"boss",minutes:[15,25],logline:"Lou's old boyfriend walks in with a hammer, smiling.",readAloud:["[[npc:oh-dae-su]] walks into the ring of cameras, holding a hammer and smiling."],objective:"Survive Oh Dae-su.",variantMust:{outline:["Oh Dae-su should be strong enough to kill **at least 2 players**.","Flynn has plot armor. The other players do not."],expanded:["Attrition, not the wipe. He may kill somebody if the party enters hurt or rolls badly.","Do not force a death if the players dominate him. That is what [[npc:cat]] is for."]},cast:["oh-dae-su","lou"],encounters:[{label:"Oh Dae-su",foes:["oh-dae-su"]}],notes:["He does not negotiate. He advances relentlessly toward whoever hurt him last.","If somebody reaches 0 HP, they die and become a ghost ([[rule:ghosts]]).","Fight length: 2 to 4 rounds."],loot:["dae-su-hammer"],effects:[{kind:"npcs",ids:["oh-dae-su"],patch:{status:"defeated"},label:"Oh Dae-su is down"}],films:["oldboy"],source:`Oh Dae-su from Old Boy walks into the ring of cameras, holding a hammer and smiling.

Flynn has plot armor, the other players do not. No matter what, Flynn can't die, his masks basically prevent it. And it's important to the story.

Oh Dae-su should be strong enough to kill at least 2 players.`,next:["toothless"],layout:{col:15,lane:0}}),j({id:"toothless",act:"studio",slate:"18",title:"Toothless",ref:"Scene 4 (Hollywood)",slug:"INT. THE VOLUME \u2014 LATER",kind:"boss",minutes:[20,30],logline:"The lights drop. The Volume fills with sky and fire. Something fast is up there.",readAloud:["Lou introduces the next act. The lights drop. The Volume fills with sky, cliffs and fire, though everyone can still feel the studio floor under their feet.","[[npc:toothless]] dives out of the dark."],objective:"Survive Toothless.",variantMust:{outline:["Toothless needs to take out **every character except Flynn**."],expanded:["Scarier than Oh Dae-su but still beatable: more damage and chaos, not the mandatory wipe.","At 0 HP he crashes and is incapacitated. Give the party half a breath, then introduce the Cat."]},cast:["toothless","lou"],encounters:[{label:"Toothless",foes:["toothless"]}],tips:["Studio rigging, cables and lights.","Pistols and the bow.","Oogwaydn's improvised camera or mic stand.","Ghosts as distractions."],notes:["Tactics: stays Nearby or Far Away, plasma-blasts exposed targets, dives Close to bite, flies away after striking.","Fight length: 3 to 5 rounds."],effects:[{kind:"npcs",ids:["toothless"],patch:{status:"defeated"},label:"Toothless crashes"},{kind:"pcs",filter:"notFlynn",patch:{status:"ghost",hp:0},label:"Everyone except Flynn is taken out",only:"outline"}],films:["httyd"],source:`After Oh Dae-su they fight Toothless from How to Train Your Dragon.

Toothless needs to take out every character except Flynn.`,next:["cat","fourth-mask"],layout:{col:16,lane:0}}),j({id:"cat",act:"studio",slate:"19",title:"The Cat in the Hat",ref:"Expanded build",expandedOnly:!0,optional:!0,slug:"INT. THE VOLUME \u2014 A RED DOOR APPEARS",kind:"boss",minutes:[10,20],logline:"The DM's big moment. Invincible. Wipes everyone except Flynn.",readAloud:["A red door appears in the middle of the Volume wall, and opens. Out steps the Cat in the Hat, as if he belongs in a different genre entirely.",'"Well. This set is a mess."'],objective:"Wipe everyone except Flynn, playfully, in 2 to 4 rounds.",mustHappen:["Every living non-Flynn player becomes a ghost.","The Cat cannot kill Flynn. A lethal hit leaves him at 1 HP."],cast:["cat","lou"],encounters:[{label:"The Cat in the Hat",foes:["cat"]}],lines:[{by:"cat",text:"Well. This set is a mess."},{by:"cat",text:"Much better. One groom. Cleaner composition.",note:"Exit line, then he bows and leaves."}],notes:["Entrance options: a red door opens in the Volume wall; the hat rises from behind a camera cart before the Cat follows it; an enormous striped hat drops from the ceiling.","Do not make players spend ten rounds discovering he is immortal.","Round 1: demonstrate invincibility and remove one living non-Flynn player. Round 2: one or two more. Round 3: anyone left except Flynn. Round 4 only for comedy.","Every death triggers the ghost state immediately, so nobody stops playing.","Make Flynn's survival absurd: flattened into the floor and peeling himself up, the mask catching a giant hammer, thrown through a wall and landing back on set. Do not explain why."],secrets:["This is where the DM stops narrating an NPC and **plays** the Cat."],effects:[{kind:"pcs",filter:"notFlynn",patch:{status:"ghost",hp:0},label:"The wipe: every groomsman becomes a ghost"},{kind:"npcs",ids:["cat"],patch:{status:"fled"},label:"The Cat bows, tidies his hat, and leaves"}],films:["cat-in-the-hat"],source:"Not in the original outline. From the expanded build (suggestions): the Cat in the Hat is the invincible final wipe boss before Flynn faces Lou, played personally by the DM.",next:["fourth-mask"],layout:{col:17,lane:0}}),j({id:"fourth-mask",act:"studio",slate:"20",title:"The Fourth Mask",ref:"Scene 5 (Hollywood)",slug:"INT. THE VOLUME \u2014 THE FINAL SET",kind:"finale",minutes:[10,20],logline:"Lou walks in wearing the V mask. The riddle finally makes sense, if Flynn lets it.",readAloud:["Lou walks onto the studio floor wearing a V mask. Flynn's fourth mask.",`"You'll never guess where I got this from."`],beats:[{label:"Lou enters",text:"After the gauntlet, [[npc:lou]] enters wearing the [[item:v-mask]], Flynn's fourth mask."},{label:"Amy Adams text",text:"[[clue:amy-text]]"},{label:"Intended realization",text:"Flynn takes off his mask, seduces Lou into doing the same, gets close enough to take the ring, then fights him hand to hand."},{label:"Hidden rule",text:"[[ability:unmasked]]: Charisma +100 without a mask. Applies all game, revealed only when it happens."}],objective:"Flynn removes his mask, gets Lou to remove his, and gets close enough to take the ring.",mustHappen:["Lou enters only after everyone except Flynn is dead.","The phrase is not solved with a skill check. It nudges Flynn to show his face and confront Lou socially, rather than in another masked fight."],cast:["lou"],encounters:[{label:"Lou (masked)",foes:["lou"],fighters:["flynn"],phase:0}],lines:[{by:"lou",text:"You'll never guess where I got this from."},{by:"lou",text:"I didn't steal the night from you. I preserved it."},{by:"lou",text:"Five friends crossing the world for a wedding ring is already a story. Five friends dying for it is a market."}],notes:["Do not send Louise's text instantly. Give Flynn a moment to struggle with Lou first.","If players are confused, use the text. Do not immediately explain the answer.","Approaches that work: seduce him; compliment the mask and ask to see his face; tell Lou the shot is better if both are unmasked; convince him the documentary needs a real ending; challenge him to prove he is not afraid.","Ghosts can shout advice, insult Lou, or distract him."],secrets:['If Flynn takes off his mask, **stop**. Tell him: **"Your Charisma is now +100."** Make it a reveal to the whole table.',"Still ask Flynn to roll. With +100 the question is not whether he succeeds, but what he says that makes the scene funny or unexpectedly sincere.","Lou's weakness: control, attention, and the perfect image."],effects:[{kind:"items",ids:["v-mask"],patch:{revealed:!0,state:"enemy"},label:"Reveal the V mask"},{kind:"clues",ids:["amy-text"],label:"Louise texts Flynn"},{kind:"pcs",filter:"flynn",patch:{mask:"none"},label:"Flynn takes off his mask"},{kind:"abilities",ids:["unmasked"],patch:{revealed:!0},label:"Reveal: Charisma +100"},{kind:"npcs",ids:["lou"],patch:{phase:1,hp:14},label:"Lou removes the V mask (unmasked stats)"}],films:["v-for-vendetta","nightcrawler","arrival"],source:`After they defeat Toothless Lou enters wearing V's mask, Flynn's fourth mask. "You'll never guess where I got this from."

At that moment, Amy Adams texts him "Did you ever figure out what "out of the closet without a face." meant?"

It's at this point I'm hoping Flynn realizes that he must take off his mask and seduce Lou into doing the same, and get him close enough to take off the ring and then fight him in hand to hand combat.

Flynn's charisma goes up by 100 when he takes off the masks. This rule applies the whole game but the DM only reveals it when it happens in game when Flynn decides to wear no mask. Hopefully he doesn't take off the mask before this but it's also possible he chooses no mask early on.`,next:["showdown"],layout:{col:18,lane:0}}),j({id:"showdown",act:"studio",slate:"21",title:"Flynn vs. Lou",ref:"Scene 6 (Hollywood)",slug:"INT. THE VOLUME \u2014 CONTINUOUS",kind:"finale",minutes:[5,10],logline:"Hand to hand. Flynn wins. Flynn takes back the ring.",readAloud:["The masks are off. The cameras are still rolling. Flynn fights Lou."],objective:"A cinematic final fight that Flynn wins.",mustHappen:["Flynn wins.","Flynn gets the final victory. Do not steal it with a ghost finishing blow or another NPC."],cast:["lou"],encounters:[{label:"Lou (unmasked)",foes:["lou"],fighters:["flynn"],phase:1}],notes:["Let Flynn and Lou exchange a few rolls. Make it cinematic.","Do not accidentally kill Flynn or let Lou escape with the ring.","Flynn can take the ring during or immediately after the fight."],effects:[{kind:"items",ids:["wedding-ring"],patch:{state:"held",holder:"flynn"},label:"Flynn takes back the ring"},{kind:"items",ids:["v-mask"],patch:{state:"held",holder:"flynn",revealed:!0},label:"Flynn recovers the V mask"},{kind:"npcs",ids:["lou"],patch:{status:"defeated"},label:"Lou is beaten"}],films:["nightcrawler"],source:"Flynn fights Lou. Flynn wins.",next:["epilogue"],layout:{col:19,lane:0}}),j({id:"epilogue",act:"epilogue",slate:"22",title:"The Donut Shop",ref:"Epilogue",slug:"EXT. HOLLYWOOD, A DONUT SHOP \u2014 DAWN",kind:"epilogue",minutes:[10,15],clock:"Wedding day",logline:"Revive the ghosts, or don't. Sail home. Marry Caley.",readAloud:["There's a donut shop outside the studio. It's open, because Hollywood has no normal rules.","Flynn can revive everyone, if he does a random and stupid act. He does not have to.","Either way, friends or no friends, Flynn sails back to New Zealand and marries [[npc:caley]]. They live happily ever after.","The groomsmen all died of alcohol poisoning the night of the wedding."],beats:[{label:"Revival option",text:"A donut shop outside the studio. Flynn can revive everyone with a random and stupid act, if he wants to."},{label:"Ending",text:"Flynn sails back to New Zealand and marries Caley. The groomsmen die of alcohol poisoning the night of the wedding."}],objective:"Let the table decide who comes back.",cast:["caley"],notes:["For every resurrection, Flynn or another living player performs a statistically improbable action **in real life** ([[rule:donut-rule]]).","Use the stupidest things that happened during the session as inspiration. Do not prewrite the challenges; the table will create better material.","If friends are revived, they return with him. If Flynn leaves them dead, their ghosts can still complain about it.","Use or omit the final dark joke depending on the room's mood."],films:["eeaao"],source:`There's a donut shop outside the studio, Flynn can revive everyone if he does a random and stupid act. He does not have to do this if he doesn't want to.

Either way, friends or no friends, Flynn sails back to New Zealand and marries Caley. They live happily ever after. The groomsmen all died of alcohol poisoning the night of the wedding.`,next:[],layout:{col:20,lane:0}})],pi=["pride","lust","greed","envy","wrath","sloth","gluttony"],mi=[{id:"p-open",label:"Prologue + field",scenes:["prologue","morning"],min:[10,15]},{id:"p-bar",label:"Green Dragon + Gentlemen + Louise",scenes:["green-dragon","gentlemen","louise-call"],min:[45,60]},{id:"p-costello",label:"Costello",scenes:["costello"],min:[15,20]},{id:"p-route",label:"Airport / boat / Tyler",scenes:["route-choice","airfield","harbor","docks"],min:[30,45]},{id:"p-sea",label:"Sea transition",scenes:["voyage"],min:[10,15]},{id:"p-island",label:"John Doe + Seven Sins",scenes:["john-doe","pride","lust","greed","envy","wrath","sloth","gluttony"],min:[70,100]},{id:"p-hollywood",label:"Hollywood arrival",scenes:["fielder"],min:[15,20]},{id:"p-studio",label:"Studio gauntlet",scenes:["volume","oh-dae-su","toothless","cat"],min:[60,80]},{id:"p-finale",label:"Lou + epilogue",scenes:["fourth-mask","showdown","epilogue"],min:[20,30]}],jl=[{label:"Wake-up",at:"morning",hours:[36,36]},{label:"After Green Dragon / Louise",at:"costello",hours:[31,33]},{label:"After the route fight",at:"voyage",hours:[26,29]},{label:"Island arrival",at:"john-doe",hours:[18,22]},{label:"Hollywood arrival",at:"fielder",hours:[8,12]},{label:"Studio ending",at:"showdown",hours:[2,6]}]});var Y,ke,Xl,Kl,Yl,ze,Zl,Jl=$e(()=>{"use strict";Y=e=>({state:"unclaimed",holder:"",qty:null,ammo:e.ammoMax??null,revealed:!e.secret,dmNote:"",...e}),ke=e=>({used:0,enabled:!0,revealed:!e.secret,dmNote:"",...e}),Xl=[Y({id:"spider-mask",name:"Spider-Man Mask",kind:"mask",icon:"bug",state:"equipped",holder:"flynn",effect:"Grants [[ability:spider-sense]]: once per scene, Flynn asks what danger he senses is about to happen next.",notes:["Flynn starts the game wearing it, stained with vomit. The enlightened spidey-senses plus the ",name:"Bow & Arrows",kind:"weapon",icon:"crosshair",tier:"normal",dmg:"1d8",range:"Far Away",state:"enemy",holder:"suitor-bow",source:"green-dragon",effect:"Normal weapon. {{1d8}} damage from Far Away."}),Y({id:"suitor-dagger",name:"Dagger",kind:"weapon",icon:"slice",tier:"light",dmg:"1d6",range:"Close",state:"enemy",holder:"suitor-shield",source:"green-dragon",effect:"Light weapon. {{1d6}} damage."}),Y({id:"suitor-shield",name:"Shield",kind:"gear",icon:"shield",acBonus:1,state:"enemy",holder:"suitor-shield",source:"green-dragon",effect:"A held shield gives +1 AC until dropped."}),...[["pistol-michael","Michael's Pistol","michael-pearson"],["pistol-ray","Ray's Pistol","ray"],["pistol-coach","Coach's Pistol","coach"]].map(([e,t,o])=>Y({id:e,name:t,kind:"weapon",icon:"crosshair",tier:"normal",dmg:"1d8",range:"Far Away",ammoMax:6,state:"enemy",holder:o,source:"gentlemen",effect:"Pistols deal {{1d8}} and can attack from Far Away. Their advantage is range, not damage. 6 shots."})),...[["crowbar","Crowbar","normal","1d8","goon-crowbar","wrench"],["sledgehammer","Sledgehammer","heavy","1d10","goon-sledgehammer","hammer"],["machete","Machete","normal","1d8","goon-machete","slice"],["chainsaw","Chainsaw","heavy","1d10","goon-chainsaw","cog"],["taser","Taser","light","1d6","goon-taser","zap"]].map(([e,t,o,s,n,r])=>Y({id:e,name:t,kind:"weapon",icon:r,tier:o,dmg:s,range:"Close",state:"enemy",holder:n,source:"airfield",effect:e==="taser"?"Light weapon. {{1d6}} damage; on a hit the target also loses movement next turn unless they beat {{str:10}}.":`${o==="heavy"?"Heavy":"Normal"} weapon. {{${s}}} damage.`})),Y({id:"odysseus-swords",name:"Spare Swords",kind:"weapon",icon:"swords",tier:"normal",dmg:"1d8",range:"Close",qty:4,holder:"odysseus-crew",source:"voyage",effect:"Spare swords from Odysseus's men. Normal weapons, {{1d8}}."}),Y({id:"oars",name:"Boat Oars & Poles",kind:"weapon",icon:"sailboat",tier:"normal",dmg:"1d8",range:"Close",holder:"odysseus-crew",source:"voyage",effect:"Count as staff weapons for [[ability:master-of-the-staff]] ({{1d8}})."}),Y({id:"staff",name:"Improvised Staff",kind:"weapon",icon:"wand-sparkles",tier:"normal",dmg:"1d8",range:"Close",state:"unclaimed",holder:"haydn",effect:"Whatever long object [[pc:haydn]] has scavenged: broom, branch, spear, pool cue, pipe, mic stand, camera stand, boat oar, broken sign. With it: +4 to hit, {{1d8}}, may use Agility.",notes:["Rename this item whenever he finds something new (a pool cue in the bar, an oar at sea, a mic stand in the studio)."]}),Y({id:"the-box",name:"The Box",kind:"prop",icon:"package",state:"enemy",holder:"john-doe",source:"john-doe",effect:"Whoever opens it turns to stone instantly. Inside is [[item:medusa-head]].",notes:["Only one of the four groomsmen may open it. Never Flynn, never Odysseus or his men."]}),Y({id:"medusa-head",name:"Medusa's Head",kind:"hazard",icon:"eye",state:"enemy",holder:"john-doe",source:"john-doe",effect:"Gaze rule: anyone (except masked Flynn) with line of sight makes an **inverted** Perception check. 10 or lower: safe, they fail to notice her eyes. 11 or higher: turned to stone.",notes:["Flynn is immune while wearing any mask.","When John Doe is defeated and the head is covered, neutralized or destroyed, everyone turned to stone returns to normal."],films:["greek-myth"]}),Y({id:"knives",name:"David Frame's Knives",kind:"weapon",icon:"utensils-crossed",tier:"light",dmg:"1d6",range:"Close",qty:30,state:"enemy",holder:"david-frame",source:"pride",effect:"Over thirty knives. Players may take them as Light weapons ({{1d6}})."}),Y({id:"counterfeit-cash",name:"Counterfeit Money",kind:"prop",icon:"banknote",state:"enemy",holder:"ted-terger",source:"greed",effect:"Stacks of worthless counterfeit money. A joke prop. Should not solve a major later problem."}),Y({id:"alcohol-case",name:"Case of Alcohol",kind:"prop",icon:"wine",state:"enemy",holder:"ted-terger",source:"greed",effect:"A case of alcohol from the Greed room. A joke prop."}),Y({id:"lightning-rifle",name:"Lightning Rifle",kind:"weapon",icon:"zap",tier:"heavy",dmg:"1d10",range:"Far Away",state:"enemy",holder:"cypher",source:"sloth",effect:"Heavy weapon. {{1d10}} from Far Away. Unplugging what powers it is {{int:12}}."}),Y({id:"feast",name:"The Feast",kind:"consumable",icon:"utensils",source:"gluttony",effect:"Every living player returns to full HP. [[cond:hangover]] and [[cond:hunger]] end."}),Y({id:"donuts",name:"Donuts",kind:"consumable",icon:"donut",qty:5,source:"gluttony",effect:"Resurrection resource. A donut alone does nothing. See [[rule:donut-rule]].",films:["eeaao"]}),Y({id:"dr-pepper",name:"Dr Pepper",kind:"consumable",icon:"cup-soda",source:"gluttony",effect:"If [[pc:goodwin]] drinks it: +3 Agility for the rest of the current scene. Stacks with [[ability:run-gumpwin-run]]. Describe him suddenly becoming horrifyingly fast.",notes:["Hidden among the food in Baron Harkonnen's room."]}),Y({id:"dae-su-hammer",name:"Oh Dae-su's Hammer",kind:"weapon",icon:"hammer",tier:"heavy",dmg:"1d10",range:"Close",state:"enemy",holder:"oh-dae-su",source:"oh-dae-su",effect:"Heavy weapon. {{1d10}}."})],Kl=[ke({id:"mask-swap",name:"Quick Change",owner:"flynn",icon:"repeat",recharge:"turn",summary:"Flynn may switch masks at the beginning of his turn without spending his action."}),ke({id:"spider-sense",name:"Spider-Sense",owner:"flynn",icon:"radar",recharge:"scene",max:1,requires:"spider-mask",summary:'Once per scene Flynn asks, "What do I sense is about to happen next?" The DM gives a truthful sensory warning.',mechanics:["Warn about the most immediate important danger, ambush, trap, attack or escalation.","Do not reveal the whole plot. Give a useful feeling, image, sound, direction or warning."],examples:['"Your neck prickles when the bartender reaches for the phone."','"You feel danger above you, not in front of you."','"The camera crew suddenly feels much more dangerous than Nathan Fielder."'],films:["spider-verse"]}),ke({id:"batman-vision",name:"Night Vision & Accuracy",owner:"flynn",icon:"scan-eye",recharge:"passive",requires:"batman-cowl",summary:"While wearing the cowl Flynn sees clearly in darkness and gets +2 on ranged attack rolls.",mechanics:["When Flynn takes a moment to line up or inspect a target, be generous with visual information."],films:["batman"]}),ke({id:"inkblot-strength",name:"Inkblot Strength",owner:"flynn",icon:"biceps-flexed",recharge:"passive",requires:"inkblot-mask",summary:"While wearing the inkblot face cover, Flynn's Strength becomes +4 instead of +1.",limits:["Brute force, not invulnerability."],films:["watchmen"]}),ke({id:"unmasked",name:"Unmasked",owner:"flynn",icon:"scan-face",recharge:"passive",secret:!0,summary:"The instant Flynn voluntarily removes his mask, his Charisma becomes **+100**.",mechanics:["Flynn must not know this until it happens.","Still have him roll the d20 because it is fun to watch. Then add +100.","This applies from the start of the game. If Flynn randomly removes his mask early, reveal it then. Player choice wins.",'When it happens, stop and tell him: **"Your Charisma is now +100."** It should be a reveal to the whole table.']}),ke({id:"plot-armor",name:"Plot Armor",owner:"flynn",icon:"shield-check",recharge:"passive",secret:!0,summary:"Flynn cannot die before the Lou finale. If he would, he survives at 1 HP or is incapacitated without dying.",mechanics:["Masks, coincidence, enemy arrogance or an environmental interruption can explain it.",'Never announce "plot armor."',"During the studio gauntlet everyone except Flynn is allowed to die."]}),ke({id:"run-gumpwin-run",name:"Run, Gumpwin, Run",owner:"goodwin",icon:"footprints",recharge:"passive",summary:"Whenever Goodwin is specifically running, he rolls Agility checks with advantage.",mechanics:["Races, fleeing, chasing, sprinting across danger, running jumps, getting somewhere before someone else."],limits:["Does not automatically apply to every dodge or normal movement."],films:["forrest-gump"]}),ke({id:"gump-luck
